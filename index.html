<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel DRAFT</title>
<meta name="theme-color" content="#07080B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DRAFT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Tektur:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: menu de modo carreira. HUD no topo, abas como menu de jogo (L1/R1), conteúdo em blocos com canto cortado.
   Visual escuro único, de propósito: é a tela de um jogo, não um documento. */
:root{
  --bg:#07080B; --p:#0F1116; --p2:#161922; --p3:#1E222C; --ln:rgba(255,255,255,.08); --ln2:rgba(255,255,255,.16);
  --fg:#F1EFE8; --mut:#8A8F99; --gold:#E2B33C; --gold2:#F5D57A; --acc-ink:#121004;
  --pos:#4FD18B; --neg:#FF6B57; --cyan:#5CC8FF;
  --disp:"Big Shoulders Display","Big Shoulders","Arial Narrow","Roboto Condensed",sans-serif;
  --num:"Tektur","Rajdhani","Arial Narrow",monospace;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --notch:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(900px 520px at 88% -8%,rgba(92,200,255,.09),transparent 60%),radial-gradient(800px 600px at 8% -18%,rgba(226,179,60,.09),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ===== HUD ===== */
.hud{display:flex;align-items:stretch;border-bottom:1px solid var(--ln);min-height:64px}
.logo{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid var(--ln)}
.crest{width:40px;height:40px;border-radius:50%;background:#000;border:1px solid #333;display:grid;place-items:center;font:800 12px/1 var(--disp);letter-spacing:.04em;text-align:center;color:#fff;flex:none}
.crest i{display:block;width:20px;height:2px;background:var(--gold);margin:2px auto}
.logo b{font:900 26px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase}
.hcell{display:flex;flex-direction:column;justify-content:center;padding:0 20px;border-right:1px solid var(--ln);min-width:0}
.hcell small{font:600 10px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:5px;white-space:nowrap}
.hcell b{font:500 18px/1 var(--num);white-space:nowrap}
.hcell b em{font-style:normal;color:var(--gold)}
.hud .sp{flex:1}
.hcell.r{border-right:0;border-left:1px solid var(--ln)}
.hbtns{display:flex;align-items:center;gap:6px;padding-left:16px;border-left:1px solid var(--ln)}
.hb{background:var(--p);border:1px solid var(--ln);color:var(--fg);padding:7px 11px;font:700 13px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%)}
.hb:hover{border-color:var(--ln2);background:var(--p2)}
.hb.on{background:var(--gold);color:var(--acc-ink)}
.hb.eye{display:grid;place-items:center;padding:5px 9px;color:var(--gold)}
.hb.eye svg{display:block}
@media (max-width:900px){.hide-md{display:none!important}}
@media (max-width:520px){.hcell.season{display:none}}
@media (max-width:620px){.hide-sm{display:none!important}.logo{padding-right:12px}.logo b{font-size:22px}.hcell{padding:0 12px}.hbtns{padding-left:10px;margin-left:auto}.hb{padding:7px 8px}}

/* ===== menu de jogo ===== */
.menuwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:linear-gradient(var(--bg) 82%,rgba(7,8,11,0))}
.menu{display:flex;align-items:center;gap:4px;padding:12px 0 10px}
.pad{flex:none;font:600 11px/1 var(--num);color:var(--bg);background:var(--mut);border:0;border-radius:4px;padding:5px 7px}
.pad:hover{background:var(--fg)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;position:relative;z-index:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;background:none;border:0;font:800 22px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:9px 14px 11px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--acc-ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;inset:0 2px;background:linear-gradient(100deg,var(--gold),var(--gold2));transform:skewX(-14deg);z-index:-1}
@media (max-width:620px){.tabs button{font-size:19px;padding:8px 11px 10px}.pad{display:none}}

main{padding-block:10px calc(72px + env(safe-area-inset-bottom,0px))}
.note{font-size:13px;color:var(--fg);background:var(--p);border:1px solid var(--ln);border-left:3px solid var(--gold);padding:9px 12px;margin-bottom:14px}

/* ===== blocos ===== */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.tile{position:relative;background:var(--p);border:1px solid var(--ln);overflow:hidden;min-width:0;padding:18px;
  clip-path:polygon(0 0,calc(100% - var(--notch)) 0,100% var(--notch),100% 100%,0 100%)}
.tile::after{content:"";position:absolute;left:0;top:0;width:44px;height:3px;background:var(--gold)}
.lab{display:flex;align-items:center;gap:8px;font:800 15px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 14px}
.lab .k{font:600 10px/1 var(--num);background:var(--p2);border:1px solid var(--ln);color:var(--fg);padding:3px 5px;border-radius:3px;letter-spacing:.05em}
.lab .go{margin-left:auto;font:600 12px/1 var(--body);letter-spacing:.02em;text-transform:none;color:var(--gold);background:none;border:0;padding:0}
.lab .go:hover{text-decoration:underline}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:980px){.s4{grid-column:span 6}.s8,.s7,.s5{grid-column:span 12}}
@media (max-width:640px){.grid>*{grid-column:1 / -1!important}}

/* títulos de página */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.bar h2{font:900 44px/.9 var(--disp);letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1;min-width:0}
.sub{color:var(--mut);font-size:14px;margin:-8px 0 16px;max-width:64ch}
.add{background:linear-gradient(100deg,var(--gold),var(--gold2));color:var(--acc-ink);border:0;padding:9px 16px;font:800 16px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:6px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%)}
.add:hover{filter:brightness(1.08)}
.btn2{background:var(--p2);border:1px solid var(--ln2);color:var(--fg);padding:8px 14px;font:700 15px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn2:hover{background:var(--p3)}
.btn2[disabled]{opacity:.5;cursor:default}
.month{display:flex;align-items:center;border:1px solid var(--ln2);background:var(--p)}
.month button{background:none;border:0;padding:7px 11px;color:var(--mut);font-size:16px}
.month button:hover{color:var(--fg)}
.month span{min-width:110px;text-align:center;font:800 16px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase}
h3{display:flex;align-items:center;gap:10px;font:800 16px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:30px 0 12px}
h3::before{content:"";width:18px;height:3px;background:var(--gold);flex:none}
h3.late{color:var(--neg)}h3.late::before{background:var(--neg)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .accc{color:var(--gold)}
.num{font-family:var(--num);font-weight:500}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);background:var(--p)}
.kpi{padding:14px 16px;border-left:1px solid var(--ln);min-width:0}
.kpi:first-child{border-left:0}
.kpi label,.stats label{font:600 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:7px}
.kpi b{font:500 26px/1.05 var(--num);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em,.stats em{font-style:normal;font-size:12px;color:var(--mut)}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--ln)}}

/* linhas */
.rows{border-top:1px solid var(--ln)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 4px;border-bottom:1px solid var(--ln);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;align-items:center;color:var(--fg)}
button.row:hover,.row.st:hover{background:var(--p2)}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .s{grid-column:1;font-size:13px;color:var(--mut);min-width:0;overflow-wrap:anywhere}
.row .r{grid-row:1 / span 2;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .v{font:500 15px/1.2 var(--num);white-space:nowrap}
.row.withav{grid-template-columns:44px 1fr auto}
.row.withav .av{grid-row:1 / span 2}
.row.withav .t,.row.withav .s{grid-column:2}
.row.withav .r{grid-column:3}
.row.st{position:relative}
.open{background:none;border:0;padding:0;font:800 19px/1.05 var(--disp);letter-spacing:.04em;text-transform:uppercase;text-align:left;cursor:pointer;color:var(--fg)}
.open::after{content:"";position:absolute;inset:0}
.ig{position:relative;z-index:1;color:var(--gold);font-weight:500;text-decoration:none;white-space:nowrap;font-size:14px}
.ig:hover{text-decoration:underline}
.date{display:grid;grid-template-columns:56px 1fr auto;gap:12px}
.date .d{grid-row:1 / span 2;text-align:center;border-right:1px solid var(--ln);padding-right:10px}
.date .d b{font:500 24px/1 var(--num);display:block}
.date .d small{font:700 11px/1.3 var(--disp);color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.date .t,.date .s{grid-column:2}
.date .r{grid-column:3}
.pill{display:inline-block;font:700 12px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;padding:4px 7px 3px;white-space:nowrap;background:var(--p2);border-left:2px solid currentColor}
.p-mut{color:var(--mut)} .p-acc{color:var(--gold)} .p-pos{color:var(--pos)} .p-neg{color:var(--neg)} .p-info{color:var(--cyan)}
.empty{padding:26px 4px;color:var(--mut);border-bottom:1px solid var(--ln);font-size:14px}
.empty b{color:var(--fg);display:block;margin-bottom:3px;font:800 18px/1.1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.late{color:var(--neg)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--p);border:1px solid var(--ln);padding:6px 12px;font:700 14px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(226,179,60,.08)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:180px;background:var(--p);border:1px solid var(--ln2);padding:10px 12px}
.sel{background:var(--p);border:1px solid var(--ln2);padding:10px}
.seg{display:inline-flex;margin-bottom:16px;gap:4px}
.seg button{position:relative;background:var(--p);border:1px solid var(--ln);padding:9px 16px;font:800 18px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);transform:skewX(-12deg)}
.seg button span{display:inline-block;transform:skewX(12deg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.two{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}
.two>div{min-width:0}
@media (max-width:780px){.two{grid-template-columns:1fr;gap:0}}
.funnel{display:flex;height:8px;overflow:hidden;background:var(--p2);margin:4px 0 10px}
.funnel i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:14px}
.legend span{display:flex;align-items:center;gap:8px;min-width:0}
.legend span::before{content:"";width:8px;height:8px;background:var(--c);flex:none}
.legend b{font:500 15px/1 var(--num)}
.split{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ln);background:var(--p)}
.split div{padding:12px 14px;border-left:1px solid var(--ln);min-width:0}
.split div:first-child{border-left:0}
.split label{font:800 15px/1.1 var(--disp);letter-spacing:.08em;text-transform:uppercase;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
.split b{font:500 21px/1.2 var(--num);display:block}
.split em{font-style:normal;font-size:12px;color:var(--mut)}
@media (max-width:480px){.split{grid-template-columns:1fr}.split div{border-left:0;border-top:1px solid var(--ln)}.split div:first-child{border-top:0}}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.chart text{font-family:var(--num)}
.key{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.key span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--c)}

/* avatar e escudo */
.av{width:44px;height:44px;overflow:hidden;background:var(--p3);display:grid;place-items:center;font:800 17px/1 var(--disp);color:var(--mut);flex:none;clip-path:polygon(0 0,78% 0,100% 22%,100% 100%,0 100%)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:30px;height:30px;font-size:12px;clip-path:none;border-radius:50%}
.av.lg{width:56px;height:56px;font-size:20px}
.av.logo{background:#fff;border-radius:50%;clip-path:none}
.av.logo img{object-fit:contain}
.cr{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font:900 22px/1 var(--disp);letter-spacing:.04em;background:#fff;color:#151515;flex:none}
.cr img{width:100%;height:100%;object-fit:contain;background:#fff}
.cr.pl{background:#111;border:2px solid var(--ln2)}
.cr.pl img{object-fit:cover;background:#111}
.cr.tp{background:var(--p2);color:var(--mut);font-size:18px}
.nxt{margin-top:12px;font-size:13px;color:#c9ccd2;display:flex;gap:6px 14px;flex-wrap:wrap}
.nxt b{font:800 12px/1.6 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.nxt button{background:none;border:0;padding:0;color:#e6e8ec;font-size:13px;text-align:left}
.nxt button:hover{color:var(--gold)}
.nxt time{font-family:var(--num);color:var(--gold2);margin-right:4px}
.cr.dr{background:#000;color:#fff;border:2px solid var(--gold);text-align:center;font-size:16px}
.cr.dr i{display:block;width:26px;height:2px;background:var(--gold);margin:3px auto}

/* ===== carta de jogador ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.cards.top4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.cards.top4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.pcard{--cut:7%;position:relative;display:block;width:100%;aspect-ratio:5/7;border:0;padding:0;overflow:hidden;text-align:left;color:var(--ink);background:var(--tbg);container-type:inline-size;
  clip-path:polygon(0 var(--cut),var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);transition:transform .18s ease,filter .18s ease}
.pcard:hover{transform:translateY(-3px);filter:brightness(1.06)}
.pcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(118deg,var(--sheen) 0 1px,transparent 1px 7px);pointer-events:none;z-index:1}
.pcard::after{content:"";position:absolute;inset:3.5%;border:1px solid var(--edge);clip-path:inherit;pointer-events:none;z-index:3}
.pc-img{position:absolute;right:0;top:0;width:80%;height:66%;z-index:0}
.pc-img img{width:100%;height:100%;object-fit:cover;display:block;-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 98%),linear-gradient(to right,transparent 0,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 62%,transparent 98%),linear-gradient(to right,transparent 0,#000 22%);mask-composite:intersect}
.pc-img i{display:grid;place-items:center;height:100%;font:900 36cqw/1 var(--disp);font-style:normal;opacity:.26}
.pc-ger{position:absolute;left:9%;top:9%;z-index:2;display:flex;flex-direction:column;align-items:center;line-height:.86}
.pc-ger b{font:500 23cqw/.86 var(--num);letter-spacing:-.03em}
.pc-ger small{font:800 8cqw/1 var(--disp);letter-spacing:.16em;margin-top:1cqw}
.pc-ger em{font:800 6.8cqw/1 var(--disp);font-style:normal;letter-spacing:.08em;margin-top:4cqw;padding:1.5cqw 2.5cqw;border:1px solid var(--edge)}
.pc-pos{position:absolute;left:7%;top:50%;z-index:2;font:800 6.4cqw/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-name{position:absolute;left:8%;right:8%;top:64%;z-index:2;text-align:center;font:900 12cqw/1.05 var(--disp);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2.5cqw;border-bottom:1px solid var(--edge)}
.pc-attrs{position:absolute;left:9%;right:9%;top:79%;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5cqw 2cqw}
.pc-attrs span{display:flex;gap:1.5cqw;align-items:baseline;justify-content:center;font:800 6cqw/1 var(--disp);letter-spacing:.06em;white-space:nowrap;overflow:hidden}
.pc-attrs b{font:500 8cqw/1 var(--num)}
.t-bronze{--tbg:linear-gradient(155deg,#5b3a26 0%,#b77f55 38%,#d7a77d 50%,#8b5d3f 72%,#4c3020 100%);--ink:#22140a;--edge:rgba(34,20,10,.35);--sheen:rgba(255,235,210,.08)}
.t-prata{--tbg:linear-gradient(155deg,#6c737a 0%,#c9ced3 38%,#eef0f2 50%,#a3a9af 72%,#5f656c 100%);--ink:#16191d;--edge:rgba(22,25,29,.3);--sheen:rgba(255,255,255,.12)}
.t-ouro{--tbg:linear-gradient(155deg,#7d5a14 0%,#d8b14f 36%,#f6df92 50%,#c69c3a 70%,#6f4f10 100%);--ink:#241903;--edge:rgba(36,25,3,.32);--sheen:rgba(255,248,220,.14)}
.t-elite{--tbg:radial-gradient(120% 80% at 70% 10%,#2b2512 0%,transparent 60%),linear-gradient(155deg,#050506 0%,#16140f 50%,#070708 100%);--ink:#F2D37C;--edge:rgba(226,179,60,.55);--sheen:rgba(226,179,60,.07)}
.t-none{--tbg:linear-gradient(155deg,#1E222C,#12141a);--ink:var(--fg);--edge:var(--ln2);--sheen:transparent}

/* ===== visão geral ===== */
.t-match{min-height:340px;padding:0;background:#05070c}
.t-match>img,.t-match>.bgpat{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8}
.bgpat{background:radial-gradient(60% 80% at 80% 10%,rgba(255,236,190,.18),transparent 60%),linear-gradient(110deg,#0b1430,#2a0c14);}
.t-match::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,12,.95) 0%,rgba(5,7,12,.55) 55%,rgba(5,7,12,.2)),linear-gradient(to top,rgba(5,7,12,.92),transparent 55%);z-index:1}
.mi{position:relative;z-index:2;padding:20px;min-height:340px;display:flex;flex-direction:column}
.fix{display:flex;align-items:center;gap:20px;margin:auto 0 16px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:110px}
.side small{font:800 13px/1.1 var(--disp);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.vs{font:900 52px/1 var(--disp);color:var(--gold);font-style:italic}
.mt h4{font:900 48px/.92 var(--disp);text-transform:uppercase;letter-spacing:.01em;margin:0 0 8px;max-width:15ch;text-wrap:balance;overflow-wrap:anywhere}
.mt p{margin:0;color:#cfd3da}
.count{display:flex;gap:22px;margin-top:16px;align-items:flex-end;flex-wrap:wrap}
.count div b{display:block;font:500 32px/1 var(--num);color:var(--gold2)}
.count div small{font:600 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.esc{display:flex;margin-left:auto}
.esc .av{border:2px solid #05070c;margin-left:-10px;width:40px;height:40px;border-radius:50%;clip-path:none}
.t-star{min-height:340px;background:linear-gradient(160deg,#17140c,#0b0b0d 60%)}
.star{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:end;min-height:270px}
.star .ph{grid-column:2;grid-row:1;height:230px;overflow:hidden}
.star .ph img{width:100%;height:100%;object-fit:cover;object-position:top;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.star .ph i{display:grid;place-items:center;height:100%;font:900 90px/1 var(--disp);font-style:normal;color:rgba(226,179,60,.2)}
.ovr{font:500 84px/.8 var(--num);color:var(--gold2)}
.ovr+small{display:block;font:800 14px/1 var(--disp);letter-spacing:.2em;color:var(--gold);margin-top:6px}
.ab{display:grid;grid-template-columns:repeat(3,auto);gap:6px 12px;margin-top:12px}
.ab span{font:800 12px/1 var(--disp);letter-spacing:.08em;color:var(--mut)}.ab b{font:500 17px/1 var(--num);color:var(--fg);margin-right:3px}
.sn{grid-column:1 / -1;font:900 34px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em;border-top:1px solid rgba(226,179,60,.3);padding-top:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--fg);text-align:left;padding-left:0;padding-right:0}
.sn span{font:600 12px/1 var(--body);letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.bignum{font:500 40px/1 var(--num);letter-spacing:-.01em}
.bignum small{font:600 13px var(--body);color:var(--pos);margin-left:8px;letter-spacing:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.duo small,.socio small{display:block;font:600 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.duo b{font:500 19px/1 var(--num)}
.meta{margin-top:16px}
.meta .mb{height:10px;background:var(--p2);transform:skewX(-20deg);position:relative;overflow:hidden}
.meta .mb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.meta .mb i.full{background:linear-gradient(90deg,var(--pos),#9cf0c2)}
.meta p{display:flex;justify-content:space-between;gap:8px;margin:7px 0 0;font:500 12px/1.3 var(--num);color:var(--mut)}
.meta p b{color:var(--fg);font-weight:500}
.meta .setm{background:none;border:0;padding:0;color:var(--gold);font:600 12px var(--body)}
.bars{display:flex;align-items:flex-end;gap:6px;height:52px;margin-top:14px}
.bars i{flex:1;background:var(--p2);position:relative;height:100%}
.bars i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--pos);opacity:.85}
.bars i.now::after{background:var(--gold)}
.bars i.negb::after{background:var(--neg)}
.bmon{display:flex;gap:6px;margin-top:4px}.bmon span{flex:1;text-align:center;font:700 10px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.socio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;border-top:1px solid var(--ln);padding-top:12px}
.socio div{min-width:0}.socio small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.socio b{font:500 15px/1 var(--num)}
.pr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--fg);text-align:left}
.pr:hover{background:var(--p2)}
.pr b{font:800 19px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;display:block}
.pr small{color:var(--mut);font-size:12px}
.pot{text-align:right}
.pot b{font:500 22px/1 var(--num);color:var(--cyan)}
.pot small{display:block;font:800 10px/1 var(--disp);letter-spacing:.16em;color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:4px 0 14px}
.steps div{background:var(--p2);padding:10px 8px 10px 14px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);min-width:0}
.steps div:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);padding-left:10px}
.steps b{display:block;font:500 24px/1 var(--num)}
.steps small{font:700 10px/1.2 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .w b{color:var(--pos)}
.ptx{font-size:13px;color:var(--mut)}.ptx b{color:var(--fg);font:500 15px var(--num)}
.nw{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--ln);align-items:start;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--fg);text-align:left}
button.nw:hover{background:var(--p2)}
.nw time{font:500 12px/1.3 var(--num);color:var(--mut)}
.nw p{margin:0}.nw p b{font-weight:600}
.tag{display:inline-block;font:800 11px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;padding:3px 6px;margin-right:6px;background:var(--p2);color:var(--gold)}
.tag.g{color:var(--pos)}.tag.c{color:var(--cyan)}.tag.r{color:var(--neg)}
.mail{display:grid;grid-template-columns:10px 1fr auto;gap:12px;padding:11px 0;border-top:1px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--fg);text-align:left;align-items:start}
button.mail:hover{background:var(--p2)}
.mail i{width:8px;height:8px;border-radius:50%;background:var(--p3);margin-top:6px}
.mail i.r{background:var(--neg)}.mail i.a{background:var(--gold)}.mail i.c{background:var(--cyan)}
.mail b{display:block;font-weight:600}.mail small{color:var(--mut)}
.mail .ar{color:var(--mut);font-size:13px}
.clean{color:var(--mut);font-size:14px;padding:10px 0;border-top:1px solid var(--ln)}

/* conquistas */
.selos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px 10px}
.selo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.hex{width:60px;height:68px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 24%,100% 76%,50% 100%,0 76%,0 24%);font:500 15px/1 var(--num);color:#1a1204}
.hex.bronze{background:linear-gradient(160deg,#e3b48c,#8a5a39)}.hex.prata{background:linear-gradient(160deg,#f2f4f6,#8d949a)}
.hex.ouro{background:linear-gradient(160deg,#f6df92,#b58a28)}.hex.hf{background:linear-gradient(160deg,#ff8a6b,#c42d12);color:#fff}
.selo.off .hex{background:var(--p2);color:var(--mut);outline:1px dashed var(--ln2);outline-offset:-4px}
.selo b{font:800 13px/1.1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.selo small{font-size:11px;color:var(--mut);line-height:1.25}
.selo.off b{color:var(--mut)}

/* ===== artistas: draft ===== */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
@media (max-width:760px){.board{grid-template-columns:repeat(3,84%)}}
.col{scroll-snap-align:start;min-width:0;background:var(--p);border:1px solid var(--ln);padding:12px;display:flex;flex-direction:column;gap:10px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.col h4{margin:0 0 2px;font:900 20px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between}
.col h4 span{font:500 16px var(--num);color:var(--mut)}
.pros{position:relative;display:grid;grid-template-columns:56px 1fr;gap:4px 12px;padding:10px;border:1px solid var(--ln);background:var(--bg)}
.pros .av{grid-row:1 / span 3}
.pros .nm{min-width:0}
.pros .meta2{font-size:12px;color:var(--mut)}
.pros .rt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font:500 13px/1 var(--num);padding:4px 6px;background:var(--p2)}
.badge.g{background:var(--gold);color:var(--acc-ink)}
.badge.p{color:var(--cyan)}
.pros .go{grid-column:1 / -1;display:flex;gap:6px;margin-top:6px;position:relative;z-index:1}
.pros .go button{flex:1;justify-content:center;padding:7px 8px;font-size:14px}
.colempty{font-size:13px;color:var(--mut);padding:8px 2px}

/* ===== ficha ===== */
.back{background:none;border:0;color:var(--mut);padding:0;margin:4px 0 14px;font:800 15px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase}
.back:hover{color:var(--fg)}
.prof{position:relative;overflow:hidden;border:1px solid var(--ln);background:var(--p);display:grid;grid-template-columns:240px minmax(0,1fr) 270px;gap:26px;padding:24px;align-items:center;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.prof::after{content:"";position:absolute;left:0;top:0;width:60px;height:3px;background:var(--gold)}
.prof-bg{position:absolute;inset:-40px;background:var(--ph) center/cover;filter:blur(38px) saturate(1.3);opacity:.32;pointer-events:none}
.prof>*:not(.prof-bg){position:relative}
.prof-info{min-width:0;display:flex;flex-direction:column;gap:12px}
.eyebrow{font:800 13px/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.prof h1,.ev-hero h1{font:900 clamp(40px,6.4vw,74px)/.88 var(--disp);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.linkrow{display:flex;gap:14px;flex-wrap:wrap}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mut)}
.gp{max-width:440px}
.gp .lbl{display:flex;justify-content:space-between;font:800 13px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
.gp .lbl b{color:var(--fg);font:500 20px/1 var(--num);letter-spacing:0;margin-left:4px}
.gp .trk{position:relative;height:10px;background:var(--p2);overflow:hidden;transform:skewX(-20deg)}
.gp .trk i{position:absolute;left:0;top:0;bottom:0}
.gp .trk .p{background:repeating-linear-gradient(135deg,var(--cyan) 0 3px,transparent 3px 6px);opacity:.6}
.gp .trk .g{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.radar svg{display:block;width:100%;height:auto;overflow:visible}
.radar text{font-family:var(--disp);font-weight:800;letter-spacing:.08em}
.radar .val{font-family:var(--num);font-weight:500;letter-spacing:0}
@media (max-width:1000px){.prof{grid-template-columns:220px minmax(0,1fr)}.prof .radar{grid-column:1 / -1;max-width:320px;justify-self:center}}
@media (max-width:640px){.gp .lbl span:nth-child(2){display:none}.prof{grid-template-columns:1fr;justify-items:center;text-align:center;padding:20px 16px}.prof-info{align-items:center}.linkrow,.pillrow,.acts{justify-content:center}.prof .pcard{width:min(230px,66vw)}.gp{width:100%}.prof .radar{width:100%}}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:12px 32px}
@media (max-width:560px){.attrs{grid-template-columns:1fr}}
.at{display:grid;grid-template-columns:46px 1fr 38px;gap:10px;align-items:center}
.at abbr{font:900 17px/1 var(--disp);letter-spacing:.1em;text-decoration:none}
.at .bx{display:flex;flex-direction:column;gap:5px;min-width:0}
.at .bx small{font-size:12px;color:var(--mut)}
.at .bx span{height:6px;background:var(--p2);overflow:hidden;transform:skewX(-20deg)}
.at .bx span i{display:block;height:100%;background:currentColor}
.at b{font:500 22px/1 var(--num);text-align:right}
.hi{color:var(--pos)} .md{color:var(--gold)} .lo{color:var(--neg)} .na{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--ln);background:var(--p)}
.stats div{padding:14px 16px;border-left:1px solid var(--ln);border-top:1px solid var(--ln);margin:-1px 0 0 -1px;min-width:0}
.stats b{font:500 23px/1.1 var(--num);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:9px 18px;font-size:14px;margin:0}
.dl dt{color:var(--mut);font:800 13px/1.5 var(--disp);letter-spacing:.1em;text-transform:uppercase}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:text}
.txt{white-space:pre-wrap;max-width:70ch;color:var(--fg);margin:0}
.spark svg{display:block;width:100%;height:auto;max-height:180px}
.spark text{font-family:var(--num)}

/* ===== eventos (confrontos) ===== */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.game{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:250px;border:1px solid var(--ln);overflow:hidden;background:#05070c;padding:0;text-align:left;color:var(--fg);width:100%;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.game:hover{border-color:var(--ln2)}
.game:hover>img{transform:scale(1.03)}
.game>img,.game>.bgpat{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7;transition:transform .4s ease}
.game::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,7,12,.96) 30%,rgba(5,7,12,.3));z-index:1}
.game>*:not(img):not(.bgpat){position:relative;z-index:2}
.g-top{position:absolute!important;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}
.g-top time{font:500 13px/1 var(--num);color:#d8dbe0}
.g-mid{display:flex;align-items:center;gap:12px;padding:0 14px}
.g-mid .cr{width:46px;height:46px;font-size:14px}
.g-mid .cr.dr{font-size:10px}.g-mid .cr.dr i{width:16px;margin:2px auto}
.g-mid em{font:900 26px/1 var(--disp);color:var(--gold);font-style:italic}
.g-t{display:block;font:900 26px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;padding:10px 14px 4px;overflow-wrap:anywhere}
.g-b{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 14px 14px;font-size:13px;color:#c9ccd2}
.g-b b{font:500 15px/1 var(--num);color:var(--fg)}
.stack{display:flex}
.stack .av{border:2px solid #05070c;margin-left:-8px}
.stack .av:first-child{margin-left:0}
.ev-hero{position:relative;overflow:hidden;background:#05070c;min-height:330px;display:flex;align-items:flex-end;border:1px solid var(--ln);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.ev-hero>img,.ev-hero>.bgpat{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8}
.ev-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,12,.92),rgba(5,7,12,.35) 70%),linear-gradient(to top,rgba(5,7,12,.9),transparent 60%)}
.ev-hero .htxt{position:relative;z-index:1;padding:22px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0;width:100%}
.ev-hero .htxt p{margin:0;color:#d4d7dd}
.artchips{display:flex;gap:8px;flex-wrap:wrap}
.artchip{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);padding:5px 12px 5px 5px;background:var(--p);color:var(--fg);font:800 16px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.artchip:hover{border-color:var(--ln2)}
.artchip span{font:500 14px var(--num);color:var(--gold)}

/* vídeos */
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.vid{display:flex;flex-direction:column;gap:6px;min-width:0}
.vid iframe{width:100%;aspect-ratio:9/16;border:0;background:var(--p2)}
.vid.wide iframe{aspect-ratio:16/9}
@media (min-width:600px){.vid.wide{grid-column:span 2}}
.vid a{font-size:12px;color:var(--mut);text-decoration:none}
.vid a:hover{color:var(--fg)}
.linklist{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:14px}
.linklist a{color:var(--gold);overflow-wrap:anywhere}

/* ===== formulário ===== */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet form{background:var(--p);border:1px solid var(--ln2);border-top:3px solid var(--gold);width:100%;max-width:660px;max-height:94%;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{align-items:center}}
.sheet h2{font:900 32px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;margin:0 0 16px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f .full{grid-column:1 / -1}
.f label{display:flex;flex-direction:column;gap:5px;font:600 12px/1.2 var(--body);color:var(--mut);min-width:0}
.f input:not([type=range]):not([type=checkbox]):not([type=file]),.f select,.f textarea{background:var(--bg);border:1px solid var(--ln2);padding:10px;font:400 15px var(--body);color:var(--fg);width:100%;min-width:0;border-radius:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);outline:0}
.f textarea{min-height:70px;resize:vertical}
.fsec{grid-column:1 / -1;font:900 18px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--fg);border-top:1px solid var(--ln);padding-top:14px;margin-top:6px}
.fsec:first-child{border-top:0;padding-top:0;margin-top:0}
.fsec small{display:block;font:400 12px/1.4 var(--body);letter-spacing:0;text-transform:none;color:var(--mut);margin-top:5px}
.rng .rh{display:flex;justify-content:space-between;align-items:baseline}
.rng .rh b{font:500 18px/1 var(--num);color:var(--gold2)}
.rng .rh b.unset{font:400 12px/1 var(--body);color:var(--mut)}
.rng input{width:100%;accent-color:var(--gold)}
.foto{display:flex;align-items:center;gap:14px}
.foto .fprev{width:84px;height:84px;background:var(--bg);border:1px solid var(--ln);overflow:hidden;display:grid;place-items:center;font-size:12px;color:var(--mut);flex:none}
.foto.capa .fprev{width:160px;height:90px}
.foto .fprev img{width:100%;height:100%;object-fit:cover}
.foto.logo .fprev{background:#fff}
.foto.logo .fprev img{object-fit:contain}
.foto .fb{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fpick{position:relative;overflow:hidden}
.fpick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--ln2);padding:7px 10px;font:600 14px var(--body);color:var(--fg)}
.actions{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}
.actions .sp{flex:1}
.del{background:none;border:1px solid var(--ln2);color:var(--neg);padding:8px 12px;font:700 15px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase}
.del.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.err{color:var(--neg);font-size:13px;margin-top:10px}
.iglink{font-size:13px;color:var(--gold);text-decoration:none;margin-top:2px}

/* dicas */
.tip p{max-width:68ch;color:var(--mut);margin:0 0 10px}
.tip ul{margin:0;padding:0;list-style:none;display:grid;gap:12px;max-width:72ch}
.tip li{border-left:2px solid var(--ln2);padding-left:12px}
.tip li b{display:block;font:800 18px/1.15 var(--disp);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.tip li span{color:var(--mut)}
.ref{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ref div{padding:14px;background:var(--p);border:1px solid var(--ln);min-width:0}
.ref b{display:block;margin-bottom:4px;font:800 18px/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.ref small{color:var(--mut);font-size:13px;display:block}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:580px}
.scale div{padding:10px 12px;color:var(--ink);background:var(--tbg)}
.scale b{display:block;font:500 20px var(--num)}
.scale small{font:800 14px var(--disp);letter-spacing:.1em}
@media (max-width:480px){.scale{grid-template-columns:1fr 1fr}}

/* login */
.login{position:fixed;inset:0;z-index:30;background:radial-gradient(70% 60% at 50% 0%,rgba(226,179,60,.14),transparent 60%),var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login>div{display:grid;gap:14px;justify-items:center;text-align:center;max-width:380px}
.login .crest{width:84px;height:84px;font-size:25px}
.login .crest i{width:44px;height:3px}
.login h1{font:900 76px/.9 var(--disp);letter-spacing:.14em;text-transform:uppercase;margin:6px 0 0}
.login .tag2{font-size:15px;color:#cfd3da;line-height:1.5;margin:0}
.login p{color:var(--mut);margin:0;font-size:14px}
.gbtn{display:flex;align-items:center;gap:10px;background:var(--fg);color:#111;border:0;padding:12px 20px;font:800 17px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;margin-top:8px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.press{font:600 11px/1 var(--num);color:var(--mut);letter-spacing:.2em;animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* música */
.music{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--p);border-top:1px solid var(--ln2);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.mu-in{padding-block:8px 10px}
.mu-bar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mu-bar b{font:900 16px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase}
.mu-bar .sp{flex:1}
.mu-body iframe{display:block;width:100%;height:80px;border:0;border-radius:12px}
.mu-now{font:800 15px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:4px}
.mu-pick{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;padding:12px;background:var(--bg);border:1px solid var(--ln)}
.mu-pick .mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mu-pick input[type=text],.mu-pick input:not([type]){flex:1;min-width:200px;background:var(--p);border:1px solid var(--ln2);padding:9px 10px}
.mu-pick small{font:800 12px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.mu-fav{display:flex;gap:6px;flex-wrap:wrap}
.mu-fav button{background:var(--p);border:1px solid var(--ln2);padding:7px 10px;font:700 14px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);display:flex;gap:6px;align-items:center}
.mu-fav button.on{border-color:var(--gold);color:var(--gold)}
.mu-fav button em{font:500 11px var(--num);font-style:normal;color:var(--mut)}
.mu-fav .x{padding:7px 8px;color:var(--mut)}
.mu-pick label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.mu-pick a{color:var(--gold);font-size:13px}
.music.min .mu-body{height:0;overflow:hidden}
.music.min .mu-in{padding-block:6px}
.music.min .mu-bar{margin-bottom:0}
body.has-music main{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
body.has-music .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* toast e draftado */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--gold);color:var(--acc-ink);padding:10px 16px;font:800 16px/1.1 var(--disp);letter-spacing:.08em;text-transform:uppercase;max-width:calc(100% - 32px)}
.fx{position:fixed;inset:0;z-index:50;background:rgba(5,5,6,.92);display:grid;place-items:center;padding:24px}
.fx .in{display:grid;justify-items:center;gap:14px;text-align:center}
.fx .pcard{width:min(250px,62vw);animation:fxcard .9s cubic-bezier(.2,.9,.25,1.2) both}
.fx .ft{font:900 clamp(56px,14vw,110px)/.85 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);margin:0;animation:fxtxt .7s .45s ease-out both}
.fx .fs{color:#d7d7d7;margin:0;font-size:15px;animation:fxtxt .6s .7s ease-out both}
.fx::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(226,179,60,.35),transparent 55%);animation:fxglow 1.4s ease-out both;pointer-events:none}
@keyframes fxcard{from{transform:scale(.55) rotateY(70deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fxtxt{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fxglow{0%{opacity:0}30%{opacity:1}100%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function embed(u){
  u=u.trim();let m;
  if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/))return{src:`https://www.youtube-nocookie.com/embed/${m[1]}`,wide:!/shorts\//.test(u),u};
  if(m=u.match(/instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/))return{src:`https://www.instagram.com/${m[1]==='p'?'p':m[1]==='tv'?'tv':'reel'}/${m[2]}/embed`,u};
  if(m=u.match(/tiktok\.com\/@[\w.]+\/video\/(\d+)/))return{src:`https://www.tiktok.com/embed/v2/${m[1]}`,u};
  if(/^https?:\/\//i.test(u))return{link:1,u};
  return null;
}
function media(text,title){
  const items=String(text||'').split(/\s+/).filter(Boolean).map(embed).filter(Boolean);
  if(!items.length)return null;
  const vids=items.filter(i=>!i.link),links=items.filter(i=>i.link);
  const html=`<h3>${esc(title)}</h3>${vids.length?`<div class="media">${vids.map(i=>`<div class="vid${i.wide?' wide':''}"><iframe src="${esc(i.src)}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen title="Vídeo"></iframe><a href="${esc(i.u)}" target="_blank" rel="noopener">Abrir original ↗</a></div>`).join('')}</div>`:''}
    ${links.length?`<div class="linklist">${links.map(l=>`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.u.replace(/^https?:\/\/(www\.)?/,''))} ↗</a>`).join('')}</div>`:''}`;
  return {key:text,html};
}

  S.data.artistas.filter(a=>a.status==='Ativo'&&a.contratoAte&&a.contratoAte<=in30).forEach(a=>{const n=daysTo(a.contratoAte);

    else if(x.tipo==='Saída'&&x.data<=in7)M.push({s:2,c:'a',t:`Pagar ${money0(x.valor)}: ${x.desc}`,d:`Vence ${dShort(x.data)}`,a:`data-open="financeiro:${x.id}"`});});
  S.data.eventos.forEach(e=>{

function newsHook(coll,id,prev,body){

    if(prev&&prev.status!=='Ativo'&&body.status==='Ativo')N.push(['draft-'+id,{tipo:'draft'}]);
    if(!prev&&DRAFT_COLS.includes(body.status))N.push(['radar-'+id,{tipo:'radar'}]);
    const h=body.historico||[];
    if(prev&&h.length>=2&&h[h.length-1].d===TODAY){const a=h[h.length-2].o,b=h[h.length-1].o;if(a!==b)N.push([`evo-${id}-${TODAY}`,{tipo:'evo',a,b}])}
  }
  if(coll==='eventos'&&body.status!==(prev&&prev.status)&&['Fechado','Realizado','Pago'].includes(body.status))N.push([`ev-${id}-${body.status}`,{tipo:body.status}]);
  if(coll==='marcas'&&body.status==='Fechado'&&(!prev||prev.status!=='Fechado'))N.push(['mk-'+id,{tipo:'marca'}]);
  N.forEach(([nid,n])=>{const doc={...n,rc:coll,rid:id,em:new Date().toISOString()};applyLocal({op:'set',c:'noticias',id:nid,body:doc});put('noticias',nid,doc)});
}

/* ---------- radar hexagonal ---------- */
function radar(a){
  const at=attrs(a),K=['ALC','ENG','VIS','CON','PRO','IMG'],c=150,R=92;
  const pt=(i,r)=>{const an=(-90+i*60)*Math.PI/180;return [c+r*Math.cos(an),c+r*Math.sin(an)]};
  const poly=r=>K.map((_,i)=>pt(i,r).map(n=>n.toFixed(1)).join(',')).join(' ');
  let g='';[.25,.5,.75,1].forEach(f=>g+=`<polygon points="${poly(R*f)}" fill="${f===1?'rgba(255,255,255,.02)':'none'}" stroke="rgba(255,255,255,${f===1?.22:.08})"/>`);
  K.forEach((_,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.08)"/>`});
  if(K.some(k=>at[k]!=null))g+=`<polygon points="${K.map((k,i)=>pt(i,R*((at[k]||0)/99)).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="rgba(226,179,60,.28)" stroke="#E2B33C" stroke-width="2" stroke-linejoin="round"/>`;
  K.forEach((k,i)=>{const[x,y]=pt(i,R+32);const v=at[k];g+=`<text x="${x.toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="14" fill="#8A8F99">${k}</text><text class="val" x="${x.toFixed(1)}" y="${(y+15).toFixed(1)}" text-anchor="middle" font-size="18" fill="${v==null?'#8A8F99':v>=80?'#4FD18B':v>=65?'#E2B33C':'#FF6B57'}">${v??'–'}</text>`});
  return `<div class="radar"><svg viewBox="0 0 300 300" role="img" aria-label="Atributos em hexágono">${g}</svg></div>`;
}

function ranking(){

function spark(h){
  const sm=window.innerWidth<600,W=sm?420:1000,H=sm?120:150,L=12,R=16,T=22,B=24;
  const vs=h.map(p=>p.o),mn=Math.max(0,Math.min(...vs)-6),mx=Math.min(99,Math.max(...vs)+6);
  const x=i=>L+(W-L-R)*(h.length===1?0.5:i/(h.length-1)), y=v=>T+(H-T-B)*(1-(v-mn)/Math.max(1,mx-mn));
  const pts=h.map((p,i)=>[x(i),y(p.o)]);
  const area=`M${pts[0][0]},${H-B} `+pts.map(p=>`L${p[0]},${p[1]}`).join(' ')+` L${pts[pts.length-1][0]},${H-B} Z`;
  const last=h[h.length-1],first=h[0];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do geral de ${first.o} para ${last.o}">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--acc)" opacity=".12"/>
    <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:2.5}" fill="${i===pts.length-1?'var(--acc)':'var(--fg)'}"><title>${esc(dFull(h[i].d))}: ${h[i].o}</title></circle>`).join('')}
    <text x="${pts[pts.length-1][0]}" y="${pts[pts.length-1][1]-10}" text-anchor="end" font-size="14" font-weight="700" fill="var(--fg)">${last.o}</text>
    <text x="${L}" y="${H-6}" font-size="11" fill="var(--mut)">${esc(dFull(first.d))}</text>
    <text x="${W-R}" y="${H-6}" font-size="11" fill="var(--mut)" text-anchor="end">${esc(dFull(last.d))}</text>
  </svg>`;
}

function chart(){
  const ms=[5,4,3,2,1,0].map(k=>shiftMonth(S.month,-k)), d=ms.map(m=>finMonth(m));
  const max=Math.max(1,...d.map(x=>Math.max(x.ent,x.sai)));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const s=[1,2,2.5,5,10].find(s=>s*p>=max);return s*p})();
  const W=600,H=190,L=56,B=26,T=10,ch=H-B-T,cw=(W-L-8)/6,bw=Math.min(22,cw/3.2);
  const y=v=>T+ch-(v/nice)*ch, kfmt=v=>PRIV?'•••':v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(v);
  let g='';
  [0,.5,1].forEach(r=>{const v=nice*r;g+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${kfmt(v)}</text>`});
  const pts=[];
  d.forEach((x,i)=>{const cx=L+cw*i+cw/2;
    g+=`<rect x="${cx-bw-1}" y="${y(x.ent)}" width="${bw}" height="${Math.max(0,ch+T-y(x.ent))}" fill="var(--pos)" rx="1"><title>Entradas ${money(x.ent)}</title></rect>`;
    g+=`<rect x="${cx+1}" y="${y(x.sai)}" width="${bw}" height="${Math.max(0,ch+T-y(x.sai))}" fill="var(--neg)" rx="1"><title>Saídas ${money(x.sai)}</title></rect>`;
    const mm=+ms[i].split('-')[1];
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${i===5?'var(--fg)':'var(--mut)'}" font-weight="${i===5?600:400}">${MES[mm-1]}</text>`;
    pts.push([cx,y(Math.max(0,x.res))]);});
  g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--fg)" stroke-width="1.5"/>`;
  g+=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===5?4:2.5}" fill="var(--fg)"><title>Resultado ${money(d[i].res)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas dos últimos 6 meses">${g}</svg>`;
}

async function shrink(file,kind){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const [w,h]=kind==='capa'?[960,540]:kind==='logo'?[240,240]:[480,480];
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    const iw=img.naturalWidth,ih=img.naturalHeight;
    if(kind==='logo'){x.fillStyle='#fff';x.fillRect(0,0,w,h);const s=Math.min(w*.86/iw,h*.86/ih);x.drawImage(img,(w-iw*s)/2,(h-ih*s)/2,iw*s,ih*s)}
    else{const s=Math.max(w/iw,h/ih),dw=iw*s,dh=ih*s;x.drawImage(img,(w-dw)/2,(h-dh)*(kind==='capa'?.5:.22),dw,dh)}
    let q=.82,out=c.toDataURL('image/jpeg',q);
    while(out.length>700000&&q>.4){q-=.12;out=c.toDataURL('image/jpeg',q)}
    return out;
  }finally{URL.revokeObjectURL(url)}
}

  closer=async()=>{if(t){clearTimeout(t);await goSave()}close()};
  frm.onsubmit=e=>{e.preventDefault();closer()};
};

/* ---------- Instagram (API oficial da Meta: Business Discovery) ---------- */
let IG=null, igAutoDone=false;
const GV='v21.0';
async function igApi(path,params,host){
  const u=new URL(`https://${host||(IG&&IG.host)||'graph.facebook.com'}/${GV}/${path}`);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u);const j=await r.json().catch(()=>({error:{message:'Resposta inválida'}}));
  if(j.error)throw j.error;return j;
}
async function igConnect(token){
  if(/^IG/.test(token)){ // token do login pelo Instagram (sem Facebook)
    const me=await igApi('me',{fields:'user_id,username',access_token:token},'graph.instagram.com');
    return{igId:me.user_id||me.id,username:me.username,host:'graph.instagram.com'};
  }
  try{const me=await igApi('me',{fields:'instagram_business_account{id,username}',access_token:token});
    if(me.instagram_business_account)return{igId:me.instagram_business_account.id,username:me.instagram_business_account.username,host:'graph.facebook.com'}}
  catch(e){if(e.code===190)throw e}
  const acc=await igApi('me/accounts',{fields:'name,instagram_business_account{id,username}',access_token:token});
  const p=(acc.data||[]).find(x=>x.instagram_business_account);
  if(!p)throw{message:'nenhuma conta profissional do Instagram ligada a uma página do Facebook neste token.'};
  return{igId:p.instagram_business_account.id,username:p.instagram_business_account.username,host:'graph.facebook.com'};
}
async function igLookup(h){
  if(!IG)throw{message:'Instagram não conectado'};
  const f=`business_discovery.username(${h}){username,name,profile_picture_url,followers_count,media_count,media.limit(12){like_count,comments_count,media_product_type,permalink}}`;
  const j=await igApi(IG.igId,{fields:f,access_token:IG.token});
  const b=j.business_discovery||{};
  const m=(b.media&&b.media.data)||[];
  const inter=m.filter(x=>x.like_count!=null).map(x=>(x.like_count||0)+(x.comments_count||0));
  const eng=inter.length&&b.followers_count?inter.reduce((a,c)=>a+c,0)/inter.length/b.followers_count*100:null;
  const reels=m.filter(x=>x.media_product_type==='REELS'&&x.permalink).sort((a,c)=>((c.like_count||0)+(c.comments_count||0))-((a.like_count||0)+(a.comments_count||0))).slice(0,3).map(x=>x.permalink);
  return{nome:b.name||'',seguidores:b.followers_count||0,engaj:eng!=null?Math.round(eng*10)/10:null,fotoUrl:b.profile_picture_url||'',reels};
}
function igErr(x,h){
  if(x&&x.code===190)return 'A conexão com o Instagram expirou. Gere um token novo em Ajustes.';
  if(x&&(x.code===110||x.code===100||x.error_subcode===2207013))return `Não achei @${h} como conta profissional. O Instagram só libera dados de contas Criador ou Comercial; preencha os números à mão.`;
  if(x&&(x.code===4||x.code===17||x.code===32))return 'Limite de buscas do Instagram atingido. Tente de novo em uma hora.';
  return 'Não foi possível buscar no Instagram agora. Preencha à mão ou tente de novo.';
}
async function urlToData(url){try{const r=await fetch(url,{mode:'cors'});if(!r.ok)return null;return await shrink(await r.blob(),'sq')}catch(e){return null}}
async function igSync(id){
  const a=art(id),h=handle(a&&a.insta);if(!a||!h)return null;
  const d=await igLookup(h);
  const o={seguidores:d.seguidores||a.seguidores||'',igSyncEm:new Date().toISOString()};
  if(d.engaj!=null)o.engaj=d.engaj;
  if(d.fotoUrl&&(!a.foto||a.fotoAuto)){o.foto=await urlToData(d.fotoUrl)||d.fotoUrl;o.fotoAuto=true}
  if(!String(a.destaques||'').trim()&&d.reels.length)o.destaques=d.reels.join('\n');
  await save('artistas',id,o);return d;
}
async function igSyncBtn(id,btn){
  btn.disabled=true;btn.textContent='Buscando…';
  try{const d=await igSync(id);toast(`Atualizado: ${compact.format(d.seguidores||0)} seguidores`)}
  catch(x){toast(igErr(x,handle((art(id)||{}).insta)))}
  render();
}
async function igAuto(){
  if(igAutoDone||!IG||!S.data.artistas.length)return;igAutoDone=true;
  const lim=new Date(Date.now()-7*864e5).toISOString();
  const L=S.data.artistas.filter(a=>a.insta&&(!a.igSyncEm||a.igSyncEm<lim)).slice(0,15);
  for(const a of L){try{await igSync(a.id)}catch(x){if(x&&(x.code===190||x.code===4||x.code===17||x.code===32))break}await new Promise(r=>setTimeout(r,1500))}
}

/* ---------- música (Spotify) ---------- */
const PLAYLIST_DRAFT='https://open.spotify.com/playlist/37i9dQZF1DZ06evO4n3RKO';
const music=$('#music'),muPickEl=$('#muPick'),muNow=$('#muNow');
let SPAPI=null,SPC=null,muCur='',muStarted=false,muWant=false,MU={padrao:'',favoritos:[]};
const LSg=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, LSs=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const TIPO={playlist:'Playlist',album:'Álbum',track:'Música',artist:'Artista',show:'Podcast',episode:'Episódio'};
function spParse(v){
  v=String(v||'').trim();
  const m=v.match(/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(?:embed\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/)||v.match(/^spotify:(playlist|album|track|artist|show|episode):([A-Za-z0-9]+)$/);
  return m?{tipo:m[1],id:m[2],uri:`spotify:${m[1]}:${m[2]}`,link:`https://open.spotify.com/${m[1]}/${m[2]}`,src:`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`}:null;
}
const muPadrao=()=>MU.padrao||PLAYLIST_DRAFT;
const muAuto=()=>LSg('draft_mu_auto')!=='0';
async function spNome(link){
  const fav=(MU.favoritos||[]).find(f=>spParse(f.link)?.uri===spParse(link)?.uri);if(fav)return fav.nome;
  if(spParse(link)?.uri===spParse(muPadrao())?.uri&&!MU.padraoNome)return 'Playlist da DRAFT';
  try{const r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(spParse(link).link));if(r.ok){const j=await r.json();if(j.title)return j.title}}catch(e){}
  return (spParse(link)?.uri===spParse(muPadrao())?.uri&&MU.padraoNome)||TIPO[spParse(link)?.tipo]||'Música';
}
function muLoad(link,play){
  const p=spParse(link);if(!p)return false;
  muCur=p.link;LSs('draft_mu_atual',p.link);
  muNow.textContent=TIPO[p.tipo]||'Música';spNome(p.link).then(n=>{if(muCur===p.link)muNow.textContent=n});
  if(SPAPI){
    if(SPC){SPC.loadUri(p.uri);if(play)setTimeout(()=>SPC.play(),400)}
    else{const el=document.getElementById('muEmbed');SPAPI.createController(el,{uri:p.uri,width:'100%',height:80},c=>{SPC=c;c.addListener('playback_update',e=>{if(e&&e.data&&!e.data.isPaused)muStarted=true});c.addListener('ready',()=>{if(play||(muWant&&!muStarted))c.play()})})}
  }else{
    $('#muBody').innerHTML=`<iframe src="${esc(p.src)}" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="Player do Spotify"></iframe>`;
  }
  return true;
}
window.onSpotifyIframeApiReady=api=>{SPAPI=api;if(!music.hidden&&muCur&&!SPC){$('#muBody').innerHTML='<div id="muEmbed"></div>';muLoad(muCur,false)}};
// navegadores só liberam som depois de um toque na página: o primeiro toque no painel dá o play
function muArm(){
  const go=e=>{if(e.target.closest&&e.target.closest('#music'))return;document.removeEventListener('pointerdown',go,true);document.removeEventListener('keydown',go,true);muWant=true;if(SPC&&!muStarted&&!music.hidden)SPC.play()};
  document.addEventListener('pointerdown',go,true);document.addEventListener('keydown',go,true);
}
function muOpen(play){
  music.hidden=false;document.body.classList.add('has-music');
  if(!muCur)muLoad(LSg('draft_mu_atual')||muPadrao(),play);
  else if(play&&SPC)SPC.play();
}
function muPick(msg){
  const favs=MU.favoritos||[],cur=spParse(muCur)?.uri,isPad=cur===spParse(muPadrao())?.uri;
  muPickEl.innerHTML=`<small>Favoritos da DRAFT</small>
    <div class="mu-fav"><button type="button" data-mu="${esc(muPadrao())}" class="${isPad?'on':''}">★ ${esc(MU.padraoNome||'Playlist da DRAFT')} <em>padrão</em></button>
      ${favs.map((f,i)=>`<button type="button" data-mu="${esc(f.link)}" class="${spParse(f.link)?.uri===cur?'on':''}">${esc(f.nome)} <em>${esc(TIPO[spParse(f.link)?.tipo]||'')}</em></button><button type="button" class="x" data-murm="${i}" aria-label="Tirar ${esc(f.nome)} dos favoritos">×</button>`).join('')}</div>
    <form class="mrow" id="muForm"><input id="muLink" placeholder="Cole o link de uma playlist, artista, álbum ou música" autocomplete="off" aria-label="Link do Spotify"><button class="add" type="submit">Tocar</button></form>
    <div class="mrow"><a href="https://open.spotify.com/search" target="_blank" rel="noopener">Procurar artista no Spotify ↗</a><span class="hint">Abra o artista, toque em ··· → Compartilhar → Copiar link e cole acima.</span></div>
    <div class="mrow">${muCur&&!(favs.some(f=>spParse(f.link)?.uri===cur))&&!isPad?`<button class="btn2" type="button" id="muSave">☆ Salvar nos favoritos</button>`:''}${muCur&&!isPad?`<button class="btn2" type="button" id="muDef">Usar como padrão do painel</button>`:''}
      <label><input type="checkbox" id="muAutoChk"${muAuto()?' checked':''}> Tocar sozinho ao entrar neste aparelho</label></div>
    ${msg?`<span class="hint" style="color:var(--neg)">${esc(msg)}</span>`:''}`;
  muPickEl.hidden=false;music.classList.remove('min');
  $('#muForm').onsubmit=e=>{e.preventDefault();if(muLoad($('#muLink').value,true)){muPickEl.hidden=true}else muPick('Esse link não é do Spotify. Copie o link de uma playlist, artista, álbum ou música.')};
  muPickEl.querySelectorAll('[data-mu]').forEach(b=>b.onclick=()=>{muLoad(b.dataset.mu,true);muPickEl.hidden=true});
  muPickEl.querySelectorAll('[data-murm]').forEach(b=>b.onclick=async()=>{const f=favs.slice();f.splice(+b.dataset.murm,1);MU={...MU,favoritos:f};await put('config','musica',MU);muPick()});
  const sv=$('#muSave');if(sv)sv.onclick=async()=>{const nome=await spNome(muCur);MU={...MU,favoritos:[...favs,{nome,link:muCur}]};await put('config','musica',MU);toast('Salvo nos favoritos');muPick()};
  const df=$('#muDef');if(df)df.onclick=async()=>{const nome=await spNome(muCur);MU={...MU,padrao:muCur,padraoNome:nome};await put('config','musica',MU);toast('Nova música padrão do painel');muPick()};
  $('#muAutoChk').onchange=e=>LSs('draft_mu_auto',e.target.checked?null:'0');
}
$('#btnMusica').onclick=()=>{if(music.hidden)muOpen(true);else music.classList.toggle('min')};
$('#muMin').onclick=()=>{music.classList.toggle('min');muPickEl.hidden=true};
$('#muTrocar').onclick=()=>{if(!muPickEl.hidden){muPickEl.hidden=true;return}muPick()};
$('#muClose').onclick=()=>{music.hidden=true;muPickEl.hidden=true;document.body.classList.remove('has-music');if(SPC)SPC.pause()};

const auth=firebase.auth();
db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const newId=c=>db.collection(c).doc().id;
function applyLocal(op){
  if(!S.data[op.c])return;
  if(op.op==='del')S.data[op.c]=S.data[op.c].filter(x=>x.id!==op.id);
  else{const i=S.data[op.c].findIndex(x=>x.id===op.id);const row={id:op.id,...op.body};if(i<0)S.data[op.c].push(row);else S.data[op.c][i]=row}
}
const wait=p=>Promise.race([p,new Promise(r=>setTimeout(r,navigator.onLine?5000:30))]);
function denied(x){if(x&&x.code==='permission-denied')showStatus('Seu e-mail não tem permissão para salvar. Peça para liberar nas regras do Firebase.')}
async function put(c,id,body){const p=db.collection(c).doc(id).set(body);p.catch(denied);await wait(p)}
async function save(coll,id,o){
  const prev=S.data[coll].find(x=>x.id===id);
  const {id:_,...rest}=prev||{};
  const body={...rest,...o};
  if(prev)body.atualizadoEm=new Date().toISOString();else body.criadoEm=new Date().toISOString();
  if(coll==='artistas'){
    const g=ger(body),h=Array.isArray(body.historico)?body.historico.slice():[];
    if(g!=null){const last=h[h.length-1];if(!last||last.o!==g){if(last&&last.d===TODAY)h[h.length-1]={d:TODAY,o:g};else h.push({d:TODAY,o:g})}}
    body.historico=h.slice(-36);
  }
  applyLocal({op:'set',c:coll,id,body});
  if(coll!=='noticias')try{newsHook(coll,id,prev,body)}catch(e){}
  await put(coll,id,body);
}
async function remove(coll,id){
  if(!id)return;applyLocal({op:'del',c:coll,id});
  const p=db.collection(coll).doc(id).delete();p.catch(denied);await wait(p);
}
const status=$('#status');
let pending=false, forced='';
function showStatus(msg){
  if(msg!==undefined)forced=msg;
  let m=forced;
  if(!m&&!navigator.onLine)m='Sem internet. Tudo que você salvar fica no aparelho e sincroniza sozinho quando a conexão voltar.';
  else if(!m&&pending)m='Enviando alterações…';
  status.hidden=!m;status.textContent=m;
}
window.addEventListener('online',()=>showStatus());
window.addEventListener('offline',()=>showStatus());

async function seedOnce(){
  try{
    const flag=await db.doc('config/seed').get({source:'server'});
    if(flag.exists)return;
    const any=await db.collection('marcas').limit(1).get({source:'server'});
    const b=db.batch();
    if(any.empty)SEED.forEach(([id,marca,grupo,segmento,obs])=>b.set(db.collection('marcas').doc(id),{marca,grupo,segmento,status:'A prospectar',obs:'Sugestão: '+obs,criadoEm:new Date().toISOString()}));
    b.set(db.doc('config/seed'),{em:new Date().toISOString()});
    await b.commit();
  }catch(e){}
}
let rT=null;
const softRender=()=>{clearTimeout(rT);rT=setTimeout(()=>{if(sheet.hidden)render()},40)};
function start(){
  unsubs.forEach(u=>u());unsubs=[];
  COLLS.forEach(c=>unsubs.push(db.collection(c).onSnapshot({includeMetadataChanges:true},snap=>{
    S.data[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
    const p=snap.metadata.hasPendingWrites;if(p!==pending){pending=p;showStatus()}
    softRender();
    if(c==='artistas'&&!snap.metadata.fromCache)igAuto();
  },e=>{if(e.code==='permission-denied')showStatus('Seu e-mail ('+(auth.currentUser&&auth.currentUser.email)+') não está liberado neste painel. Peça a um sócio para adicionar nas regras do Firebase.');else showStatus('A conexão com os dados caiu. Recarregue a página.')})));
  unsubs.push(db.doc('config/instagram').onSnapshot(s=>{IG=s.exists&&s.data().token?s.data():null;igAuto()},()=>{}));
  unsubs.push(db.doc('config/musica').onSnapshot(s=>{MU=s.exists?{favoritos:[],...s.data()}:{padrao:'',favoritos:[]}},()=>{}));
  unsubs.push(db.doc('config/metas').onSnapshot(s=>{S.meta=s.exists?s.data():{};softRender()},()=>{}));
  unsubs.push(db.doc('config/socios').onSnapshot(s=>{if(s.exists&&Array.isArray(s.data().nomes)){S.socios=s.data().nomes.slice(0,3);softRender()}},()=>{}));
  seedOnce();
}
auth.onAuthStateChanged(u=>{
  $('#btnSair').title=u?'Sair ('+u.email+')':'Sair';
  if(!u){unsubs.forEach(f=>f());unsubs=[];COLLS.forEach(c=>S.data[c]=[]);loginEl.hidden=false;render();return}
  loginEl.hidden=true;forced='';showStatus();start();
  if(muAuto()&&music.hidden){muOpen(false);muArm()}
});
render();showStatus();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
