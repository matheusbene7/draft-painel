<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel DRAFT</title>
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DRAFT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo com abas; o elenco vira cartas de jogador (a única peça ousada), o resto fica em linhas sóbrias */
:root{
  --bg:#0B0C0E; --panel:#141619; --panel2:#1C1F23; --line:#262A30; --fg:#EDEEEF; --mut:#8D939B;
  --acc:#E2B33C; --acc-ink:#111; --pos:#55B880; --neg:#E2685A; --info:#7BA7D9;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --blur-op:.38;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F3F1; --panel:#FFFFFF; --panel2:#ECECE8; --line:#DFDFDA; --fg:#15161A; --mut:#676B73;
  --acc:#A97B10; --acc-ink:#fff; --pos:#2C8A55; --neg:#C04637; --info:#2F6AA8; --blur-op:.22; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F3F1; --panel:#FFFFFF; --panel2:#ECECE8; --line:#DFDFDA; --fg:#15161A; --mut:#676B73;
  --acc:#A97B10; --acc-ink:#fff; --pos:#2C8A55; --neg:#C04637; --info:#2F6AA8; --blur-op:.22; color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* cabeçalho */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.mark{width:38px;height:38px;background:#000;color:#fff;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--display);letter-spacing:.04em;flex:none;border:1px solid var(--line)}
.mark span{display:block;text-align:center}
.mark i{display:block;height:2px;width:20px;background:#E2B33C;margin:2px auto}
.brand{min-width:0}
.brand b{font:800 21px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;display:block}
.brand small{color:var(--mut);font-size:12px}
.top .sp{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:13px;color:var(--mut)}
.ghost:hover{color:var(--fg);border-color:var(--mut)}
.who{font-size:12px;color:var(--mut);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.who{display:none}.hide-sm{display:none}.top{gap:8px}.top .ghost{padding:6px 9px}}
@media (max-width:400px){.brand small{display:none}}
.brand small{white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;font:600 15px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}

main{padding-block:20px calc(72px + env(safe-area-inset-bottom,0px))}
.note{font-size:13px;color:var(--mut);border:1px dashed var(--line);padding:8px 12px;border-radius:4px;margin-bottom:16px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font:800 28px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0;flex:1;min-width:0}
.sub{color:var(--mut);font-size:14px;margin:-6px 0 16px;max-width:64ch}
.add{background:var(--acc);color:var(--acc-ink);border:0;border-radius:4px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn2{background:none;border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.btn2:hover{border-color:var(--mut)}
.btn2[disabled]{opacity:.55;cursor:default}
.month{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px}
.month button{background:none;border:0;padding:6px 10px;color:var(--mut);font-size:16px}
.month span{min-width:96px;text-align:center;font-weight:600;font-size:14px;text-transform:capitalize}
h3{font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:30px 0 12px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .accc{color:var(--acc)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.kpi b{font:700 25px/1.1 var(--display);letter-spacing:.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{font-style:normal;font-size:12px;color:var(--mut)}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;align-items:center;color:var(--fg)}
button.row:hover,.row.st:hover{background:var(--panel)}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .s{grid-column:1;font-size:13px;color:var(--mut);min-width:0;overflow-wrap:anywhere}
.row .r{grid-row:1 / span 2;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .v{font-weight:600;white-space:nowrap}
.row.withav{grid-template-columns:44px 1fr auto}
.row.withav .av{grid-row:1 / span 2}
.row.withav .t,.row.withav .s{grid-column:2}
.row.withav .r{grid-column:3}
.row.st{position:relative}
.open{background:none;border:0;padding:0;font-weight:600;text-align:left;cursor:pointer;color:var(--fg)}
.open::after{content:"";position:absolute;inset:0}
.ig{position:relative;z-index:1;color:var(--acc);font-weight:500;text-decoration:none;white-space:nowrap;font-size:14px}
.ig:hover{text-decoration:underline}
.date{display:grid;grid-template-columns:52px 1fr auto;gap:12px}
.date .d{grid-row:1 / span 2;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.date .d b{font:700 22px/1 var(--display);display:block}
.date .d small{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.date .t,.date .s{grid-column:2}
.date .r{grid-column:3}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap;background:var(--bg)}
.p-mut{color:var(--mut)} .p-acc{color:var(--acc)} .p-pos{color:var(--pos)} .p-neg{color:var(--neg)} .p-info{color:var(--info)}
.empty{padding:28px 4px;color:var(--mut);border-bottom:1px solid var(--line);font-size:14px}
.empty b{color:var(--fg);display:block;margin-bottom:2px}
.late{color:var(--neg)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--mut)}
.chip[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 10px}

.two{display:grid;grid-template-columns:1.3fr 1fr;gap:32px}
.two>div{min-width:0}
@media (max-width:780px){.two{grid-template-columns:1fr;gap:0}}
.funnel{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--line);margin:4px 0 10px}
.funnel i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.legend span{display:flex;align-items:center;gap:8px;min-width:0}
.legend span::before{content:"";width:8px;height:8px;border-radius:1px;background:var(--c);flex:none}
.split{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px}
.split div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.split div:first-child{border-left:0}
.split label{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split b{font:700 21px/1.2 var(--display);display:block}
.split em{font-style:normal;font-size:12px;color:var(--mut)}
@media (max-width:480px){.split{grid-template-columns:1fr}.split div{border-left:0;border-top:1px solid var(--line)}.split div:first-child{border-top:0}}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.key{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.key span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--c)}

/* avatar */
.av{width:44px;height:44px;border-radius:4px;overflow:hidden;background:var(--panel2);display:grid;place-items:center;font:700 16px/1 var(--display);color:var(--mut);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:30px;height:30px;font-size:12px}
.av.lg{width:56px;height:56px;font-size:20px}
.av.logo{background:#fff}
.av.logo img{object-fit:contain}

/* ===== carta de jogador ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.cards.top4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.cards.top4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.pcard{--cut:7%;position:relative;display:block;width:100%;aspect-ratio:5/7;border:0;padding:0;overflow:hidden;text-align:left;color:var(--ink);background:var(--tbg);font-family:var(--display);container-type:inline-size;
  clip-path:polygon(0 var(--cut),var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);transition:transform .18s ease,filter .18s ease}
.pcard:hover{transform:translateY(-3px);filter:brightness(1.05)}
.pcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(118deg,var(--sheen) 0 1px,transparent 1px 7px);pointer-events:none;z-index:1}
.pcard::after{content:"";position:absolute;inset:3.5%;border:1px solid var(--edge);clip-path:inherit;pointer-events:none;z-index:3}
.pc-img{position:absolute;right:0;top:0;width:80%;height:66%;z-index:0}
.pc-img img{width:100%;height:100%;object-fit:cover;display:block;-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 98%),linear-gradient(to right,transparent 0,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 62%,transparent 98%),linear-gradient(to right,transparent 0,#000 22%);mask-composite:intersect}
.pc-img i{display:grid;place-items:center;height:100%;font-style:normal;font-weight:800;font-size:34cqw;opacity:.28;letter-spacing:-.02em}
.pc-ger{position:absolute;left:9%;top:9%;z-index:2;display:flex;flex-direction:column;align-items:center;line-height:.86}
.pc-ger b{font-weight:800;font-size:25cqw;letter-spacing:-.02em}
.pc-ger small{font-weight:700;font-size:7.5cqw;letter-spacing:.12em}
.pc-ger em{font-style:normal;font-weight:700;font-size:6.5cqw;letter-spacing:.06em;margin-top:5cqw;padding:1.5cqw 2.5cqw;border:1px solid var(--edge);opacity:.9}
.pc-pos{position:absolute;left:7%;top:50%;z-index:2;font-weight:700;font-size:5.6cqw;letter-spacing:.06em;text-transform:uppercase;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-name{position:absolute;left:8%;right:8%;top:64%;z-index:2;text-align:center;font-weight:800;font-size:10.5cqw;line-height:1.1;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2.5cqw;border-bottom:1px solid var(--edge)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.seg button{background:none;border:0;padding:8px 14px;font:600 15px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.pc-attrs{position:absolute;left:9%;right:9%;top:78.5%;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5cqw 2cqw}
.pc-attrs span{display:flex;gap:1.5cqw;align-items:baseline;justify-content:center;font-weight:600;font-size:5.4cqw;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.pc-attrs b{font-weight:800;font-size:8cqw}
.t-bronze{--tbg:linear-gradient(155deg,#5b3a26 0%,#b77f55 38%,#d7a77d 50%,#8b5d3f 72%,#4c3020 100%);--ink:#22140a;--edge:rgba(34,20,10,.35);--sheen:rgba(255,235,210,.08)}
.t-prata{--tbg:linear-gradient(155deg,#6c737a 0%,#c9ced3 38%,#eef0f2 50%,#a3a9af 72%,#5f656c 100%);--ink:#16191d;--edge:rgba(22,25,29,.3);--sheen:rgba(255,255,255,.12)}
.t-ouro{--tbg:linear-gradient(155deg,#7d5a14 0%,#d8b14f 36%,#f6df92 50%,#c69c3a 70%,#6f4f10 100%);--ink:#241903;--edge:rgba(36,25,3,.32);--sheen:rgba(255,248,220,.14)}
.t-elite{--tbg:radial-gradient(120% 80% at 70% 10%,#2b2512 0%,transparent 60%),linear-gradient(155deg,#050506 0%,#16140f 50%,#070708 100%);--ink:#F2D37C;--edge:rgba(226,179,60,.55);--sheen:rgba(226,179,60,.07)}
.t-none{--tbg:linear-gradient(155deg,var(--panel2),var(--panel));--ink:var(--fg);--edge:var(--line);--sheen:transparent}
.pcard.big{max-width:280px}

/* ===== quadro de draft ===== */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
@media (max-width:760px){.board{grid-template-columns:repeat(3,84%)}}
.col{scroll-snap-align:start;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.col h4{margin:0 0 2px;font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between}
.col h4 span{color:var(--mut)}
.pros{position:relative;display:grid;grid-template-columns:56px 1fr;gap:4px 12px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.pros .av{grid-row:1 / span 3}
.pros .nm{min-width:0}
.pros .nm .open{font-size:15px}
.pros .meta{font-size:12px;color:var(--mut)}
.pros .rt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font:700 13px/1 var(--display);letter-spacing:.06em;padding:3px 6px;border-radius:3px;background:var(--panel2)}
.badge.g{background:var(--fg);color:var(--bg)}
.pros .go{grid-column:1 / -1;display:flex;gap:6px;margin-top:6px;position:relative;z-index:1}
.pros .go button{flex:1;padding:6px 8px;font-size:13px}
.colempty{font-size:13px;color:var(--mut);padding:8px 2px}

/* ===== ficha ===== */
.back{background:none;border:0;color:var(--mut);padding:0;margin-bottom:14px;font-size:14px}
.back:hover{color:var(--fg)}
.prof{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--panel);display:grid;grid-template-columns:auto 1fr;gap:28px;padding:24px}
.prof-bg{position:absolute;inset:-40px;background:var(--ph) center/cover;filter:blur(38px) saturate(1.25);opacity:var(--blur-op);pointer-events:none}
.prof>*:not(.prof-bg){position:relative}
.prof .pcard{width:240px}
.prof-info{min-width:0;display:flex;flex-direction:column;gap:12px;justify-content:center}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.prof h1,.ev-hero h1{font:800 clamp(34px,6vw,58px)/.95 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.linkrow{display:flex;gap:14px;flex-wrap:wrap}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.gp{max-width:420px}
.gp .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:6px}
.gp .lbl b{color:var(--fg);font:700 18px/1 var(--display);letter-spacing:.04em}
.gp .trk{position:relative;height:8px;background:var(--line);border-radius:2px;overflow:hidden}
.gp .trk i{position:absolute;left:0;top:0;bottom:0}
.gp .trk .p{background:repeating-linear-gradient(135deg,var(--acc) 0 3px,transparent 3px 6px);opacity:.55}
.gp .trk .g{background:var(--acc)}
@media (max-width:640px){.prof{grid-template-columns:1fr;justify-items:center;text-align:center;padding:20px 16px}.prof-info{align-items:center}.linkrow,.pillrow,.acts{justify-content:center}.prof .pcard{width:min(240px,70vw)}.gp{width:100%}}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:12px 32px}
@media (max-width:560px){.attrs{grid-template-columns:1fr}}
.at{display:grid;grid-template-columns:44px 1fr 36px;gap:10px;align-items:center}
.at abbr{font:700 15px/1 var(--display);letter-spacing:.08em;text-decoration:none}
.at .bx{display:flex;flex-direction:column;gap:4px;min-width:0}
.at .bx small{font-size:12px;color:var(--mut)}
.at .bx span{height:6px;background:var(--line);border-radius:2px;overflow:hidden}
.at .bx span i{display:block;height:100%;background:currentColor}
.at b{font:800 22px/1 var(--display);text-align:right}
.hi{color:var(--pos)} .md{color:var(--acc)} .lo{color:var(--neg)} .na{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.stats div{padding:14px 16px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px;min-width:0}
.stats label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.stats b{font:700 23px/1.1 var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats em{font-style:normal;font-size:12px;color:var(--mut)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;font-size:14px}
.dl dt{color:var(--mut)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:text}
.txt{white-space:pre-wrap;max-width:70ch;color:var(--fg);margin:0}
.spark svg{display:block;width:100%;height:auto;max-height:180px}

/* eventos */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ecard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);padding:0;text-align:left;color:var(--fg);width:100%}
.ecard:hover{border-color:var(--mut)}
.ec-img{position:relative;display:block;aspect-ratio:16/9;background:var(--panel2);overflow:hidden}
.ec-img img{width:100%;height:100%;object-fit:cover;display:block}
.ec-img .pill{position:absolute;left:10px;top:10px}

.linklist{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:14px}

.fx .in{display:grid;justify-items:center;gap:14px;text-align:center}

@keyframes fxcard{from{transform:scale(.55) rotateY(70deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fxtxt{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fxglow{0%{opacity:0}30%{opacity:1}100%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=v=>brl.format(Number(v)||0);
const compact=new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1});
const num=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const DOW=['dom','seg','ter','qua','qui','sex','sáb'], MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESF=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const dShort=s=>{if(!s)return'';const d=toDate(s);return `${DOW[d.getDay()]}, ${d.getDate()} ${MES[d.getMonth()]}`};
const dFull=s=>{if(!s)return'';const d=toDate(s);return `${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}`};
const monthLabel=m=>{const[y,mm]=m.split('-').map(Number);return `${MESF[mm-1]} ${y}`};
const shiftMonth=(m,k)=>{let[y,mm]=m.split('-').map(Number);mm+=k;while(mm<1){mm+=12;y--}while(mm>12){mm-=12;y++}return `${y}-${pad(mm)}`};
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const parseMoney=s=>{s=String(s??'').replace(/[R$%\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)||0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const socioName=i=>(i===''||i==null)?'':(S.socios[Number(i)]||'');
const art=id=>S.data.artistas.find(a=>a.id===id);
const artistaName=id=>(art(id)||{}).nome||'';
const stLabel=s=>ST_LABEL[s]||s;
const pill=(t,cls)=>t?`<span class="pill ${cls||ST_COLOR[t]||'p-mut'}">${esc(stLabel(t))}</span>`:'';
const empty=(t,s)=>`<div class="empty"><b>${esc(t)}</b>${esc(s)}</div>`;
const initials=s=>String(s||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase()||'?';
const handle=v=>{v=String(v||'').trim();if(!v)return'';const m=v.match(/(?:instagram|tiktok)\.com\/@?([^/?#\s]+)/i);if(m)v=m[1];return v.replace(/^@+/,'').replace(/[^A-Za-z0-9._]/g,'')};
const igUrl=h=>`https://www.instagram.com/${h}/`;
const ttUrl=h=>`https://www.tiktok.com/@${h}`;
const igLink=(v,label)=>{const h=handle(v);return h?`<a class="ig" href="${igUrl(h)}" target="_blank" rel="noopener">${label||'@'+esc(h)}</a>`:''};
const ttLink=(v,label)=>{const h=handle(v);return h?`<a class="ig" href="${ttUrl(h)}" target="_blank" rel="noopener">${label||'TikTok @'+esc(h)}</a>`:''};
const av=(src,txt,cls)=>`<span class="av ${cls||''}">${src?`<img src="${src}" alt="" loading="lazy">`:esc(initials(txt))}</span>`;

/* ---------- nota do jogador ---------- */
function attrs(a){
  const f=+a.seguidores||0,e=+a.engaj||0,v=+a.views||0;
  return {
    ALC:f>0?Math.round(clamp(35+(Math.log10(f)-3)*18,20,99)):null,
    ENG:e>0?Math.round(clamp(e<=5?40+e*9:85+(e-5)*2.5,20,99)):null,
    VIS:v>0?Math.round(clamp(30+(Math.log10(v)-2.5)*20,20,99)):null,
    IMG:+a.img||null, PRO:+a.pro||null, CON:+a.ent||null};
}
function ger(a){const vs=Object.values(attrs(a)).filter(x=>x!=null);return vs.length?Math.round(vs.reduce((s,x)=>s+x,0)/vs.length):null}
const tier=g=>g==null?'none':g>=85?'elite':g>=75?'ouro':g>=65?'prata':'bronze';
const TIER_N={elite:'Elite',ouro:'Ouro',prata:'Prata',bronze:'Bronze',none:'Sem nota'};
const band=v=>v==null?'na':v>=80?'hi':v>=65?'md':'lo';
function pcard(a,o={}){
  const at=attrs(a),g=ger(a),t=tier(g);
  return `<button type="button" class="pcard t-${t}${o.big?' big':''}" ${o.noclick?'tabindex="-1"':`data-prof="${a.id}"`} aria-label="${esc(a.nome)}, geral ${g??'sem nota'}">
    <span class="pc-img">${a.foto?`<img src="${a.foto}" alt="">`:`<i>${esc(initials(a.nome))}</i>`}</span>
    <span class="pc-ger"><b>${g??'–'}</b><small>GER</small>${a.pot?`<em>POT ${+a.pot}</em>`:''}</span>
    <span class="pc-pos">${esc(a.segmento||'')}</span>
    <span class="pc-name">${esc(a.nome)}</span>
    <span class="pc-attrs">${Object.entries(at).map(([k,v])=>`<span><b>${v??'–'}</b>${k}</span>`).join('')}</span>
  </button>`;
}
function evsOf(id){return S.data.eventos.filter(e=>(e.artistas||[]).includes(id))}
const fechado=e=>['Fechado','Realizado','Pago'].includes(e.status);

/* ---------- vídeos ---------- */
function embed(u){
  u=u.trim();let m;
  if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/))return{src:`https://www.youtube-nocookie.com/embed/${m[1]}`,wide:!/shorts\//.test(u),u};
  if(m=u.match(/instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/))return{src:`https://www.instagram.com/${m[1]==='p'?'p':m[1]==='tv'?'tv':'reel'}/${m[2]}/embed`,u};
  if(m=u.match(/tiktok\.com\/@[\w.]+\/video\/(\d+)/))return{src:`https://www.tiktok.com/embed/v2/${m[1]}`,u};
  if(/^https?:\/\//i.test(u))return{link:1,u};
  return null;
}
function media(text,title){
  const items=String(text||'').split(/\s+/).filter(Boolean).map(embed).filter(Boolean);
  if(!items.length)return null;
  const vids=items.filter(i=>!i.link),links=items.filter(i=>i.link);
  const html=`<h3>${esc(title)}</h3>${vids.length?`<div class="media">${vids.map(i=>`<div class="vid${i.wide?' wide':''}"><iframe src="${esc(i.src)}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen title="Vídeo"></iframe><a href="${esc(i.u)}" target="_blank" rel="noopener">Abrir original ↗</a></div>`).join('')}</div>`:''}
    ${links.length?`<div class="linklist">${links.map(l=>`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.u.replace(/^https?:\/\/(www\.)?/,''))} ↗</a>`).join('')}</div>`:''}`;
  return {key:text,html};
}

/* ---------- navegação ---------- */
const tabs=$('#tabs'), view=$('#view'), view2=$('#view2'), mslot=$('#mslot'), main=$('#main');
tabs.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)go(b.dataset.tab)});
function go(t){S.tab=t;S.detail=null;S.fStatus='';try{localStorage.setItem('draft_tab',t)}catch(e){}if(history.state&&history.state.d)history.replaceState(null,'');render();window.scrollTo(0,0)}
try{let t=localStorage.getItem('draft_tab');if(t==='elenco'||t==='draft')t='artistas';if(t&&document.querySelector(`[data-tab="${t}"]`))S.tab=t}catch(e){}
if(location.hash&&document.querySelector(`[data-tab="${location.hash.slice(1)}"]`))S.tab=location.hash.slice(1);
function openDetail(c,id){S.detail={c,id};history.pushState({d:S.detail},'');render();window.scrollTo(0,0)}
function back(){if(history.state&&history.state.d)history.back();else{S.detail=null;render()}}
window.addEventListener('popstate',e=>{S.detail=(e.state&&e.state.d)||null;if(!sheet.hidden)close();else render();window.scrollTo(0,0)});

function paint(top,med,bottom){
  view.innerHTML=top;view2.innerHTML=bottom||'';
  const k=med?med.key:'';
  if(mslot.dataset.k!==k){mslot.dataset.k=k;mslot.innerHTML=med?med.html:''}
}
function render(){
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',!S.detail&&b.dataset.tab===S.tab));
  if(S.detail){
    const r=S.data[S.detail.c].find(x=>x.id===S.detail.id);
    if(!r){paint(`<button class="back" data-act="back" type="button">‹ Voltar</button>${empty('Registro não encontrado','Ele pode ter sido excluído por outro sócio.')}`);return}
    return S.detail.c==='artistas'?vPerfil(r):vEvento(r);
  }
  ({geral:vGeral,artistas:()=>S.artView==='draft'?vDraft():vElenco(),marcas:vMarcas,agenda:vAgenda,eventos:vEventos,financeiro:vFin,dicas:vDicas})[S.tab]();
}

const ACT={
  back:()=>back(),
  m:t=>{S.month=shiftMonth(S.month,+t.dataset.v);render()},
  nicho:t=>{S.fNicho=t.dataset.v;S.pausados=false;render()},
  pausados:()=>{S.pausados=!S.pausados;S.fNicho='';render()},
  fStatus:t=>{S.fStatus=t.dataset.v;render()},
  fTipo:t=>{S.fTipo=t.dataset.v;render()},
  fSocio:t=>{S.fSocio=t.dataset.v;render()},
  passados:t=>{S.passados=t.dataset.v==='1';render()},
  novo:t=>openForm(t.dataset.v,null,t.dataset.def?JSON.parse(t.dataset.def):null),
  edit:t=>{const[c,id]=t.dataset.v.split(':');openForm(c,id)},
  avancar:t=>{const a=art(t.dataset.v);if(!a)return;const i=DRAFT_COLS.indexOf(a.status||'Observando');save('artistas',a.id,{status:DRAFT_COLS[Math.min(i+1,DRAFT_COLS.length-1)]}).then(render)},
  draftar:t=>draftar(t.dataset.v),
  lancar:t=>lancar(t.dataset.v,t),
  tab:t=>go(t.dataset.v),
  artView:t=>{S.artView=t.dataset.v;S.q='';render()},
  igsync:t=>igSyncBtn(t.dataset.v,t)
};
main.addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const t=e.target.closest('[data-prof],[data-ev],[data-open],[data-act]');
  if(!t||!main.contains(t))return;
  if(t.dataset.prof)openDetail('artistas',t.dataset.prof);
  else if(t.dataset.ev)openDetail('eventos',t.dataset.ev);
  else if(t.dataset.open){const[c,id]=t.dataset.open.split(':');openForm(c,id||null)}
  else if(t.dataset.act&&ACT[t.dataset.act])ACT[t.dataset.act](t);
});
main.addEventListener('input',e=>{if(e.target.id==='qArt'){S.q=e.target.value;elencoGrid()}});
main.addEventListener('change',e=>{if(e.target.id==='sortArt'){S.sort=e.target.value;elencoGrid()}});

/* ---------- cálculos ---------- */
function finMonth(m){
  const L=S.data.financeiro.filter(x=>(x.data||'').startsWith(m));
  const ent=L.filter(x=>x.tipo==='Entrada'&&x.status!=='Pendente').reduce((a,x)=>a+(+x.valor||0),0);
  const sai=L.filter(x=>x.tipo==='Saída'&&x.status!=='Pendente'&&x.categoria!=='Retirada de sócio').reduce((a,x)=>a+(+x.valor||0),0);
  const ret=[0,1,2].map(i=>L.filter(x=>x.categoria==='Retirada de sócio'&&String(x.socio)===String(i)&&x.status!=='Pendente').reduce((a,x)=>a+(+x.valor||0),0));
  return {L,ent,sai,res:ent-sai,ret};
}
const pend=tipo=>S.data.financeiro.filter(x=>x.tipo===tipo&&x.status==='Pendente');
const monthNav=()=>`<div class="month"><button type="button" data-act="m" data-v="-1" aria-label="Mês anterior">‹</button><span>${monthLabel(S.month)}</span><button type="button" data-act="m" data-v="1" aria-label="Próximo mês">›</button></div>`;
function upcoming(){
  const a=S.data.agenda.map(x=>({c:'agenda',id:x.id,data:x.data,hora:x.hora||'',t:x.titulo,s:[x.tipo,socioName(x.socio),artistaName(x.artista),x.local].filter(Boolean).join(' · '),tag:x.tipo||'Compromisso',socio:x.socio}));
  const e=S.data.eventos.filter(x=>x.data).map(x=>({c:'eventos',id:x.id,data:x.data,hora:'',t:x.nome,s:[x.marca,(x.artistas||[]).map(artistaName).filter(Boolean).join(', '),x.local].filter(Boolean).join(' · '),st:x.status,socio:x.socio}));
  const m=S.data.marcas.filter(x=>x.proximoData&&!['Fechado','Perdido'].includes(x.status)).map(x=>({c:'marcas',id:x.id,data:x.proximoData,hora:'',t:`${x.marca}: ${x.proximo||'retomar contato'}`,s:[x.contatoNome,socioName(x.socio)].filter(Boolean).join(' · '),tag:'Follow-up',socio:x.socio}));
  return a.concat(e,m).filter(x=>x.data).sort((p,q)=>(p.data+p.hora).localeCompare(q.data+q.hora));
}
function dateRow(x,late){
  const d=toDate(x.data);
  const attr=x.c==='eventos'?`data-ev="${x.id}"`:`data-open="${x.c}:${x.id}"`;
  return `<button class="row date" type="button" ${attr}>
    <div class="d"><b>${d.getDate()}</b><small>${MES[d.getMonth()]} · ${DOW[d.getDay()]}</small></div>
    <div class="t">${x.hora?`<span style="color:var(--mut);font-weight:500">${esc(x.hora)} </span>`:''}${esc(x.t)}</div>
    <div class="s">${esc(x.s)}</div>
    <div class="r">${late?pill('Atrasado'):x.c==='eventos'?pill(x.st||'Prospecção'):pill(x.tag,x.c==='marcas'?'p-info':'p-mut')}</div></button>`;
}
function ranking(){
  const tot={};
  S.data.eventos.filter(e=>fechado(e)&&(e.data||'').startsWith(YEAR)).forEach(e=>{
    const as=(e.artistas||[]).filter(art);if(!as.length)return;
    as.forEach(id=>{tot[id]=tot[id]||{v:0,n:0};tot[id].v+=(+e.valor||0)/as.length;tot[id].n++});
  });
  return Object.entries(tot).map(([id,o])=>({a:art(id),...o})).sort((p,q)=>q.v-p.v);
}

/* ---------- Temporada (visão geral) ---------- */
function vGeral(){
  const f=finMonth(S.month), rec=pend('Entrada'), pag=pend('Saída');
  const up=upcoming();
  const prox=up.filter(x=>x.data>=TODAY).slice(0,6);
  const atras=up.filter(x=>x.c==='marcas'&&x.data<TODAY);
  const elenco=S.data.artistas.filter(a=>a.status==='Ativo');
  const top=elenco.slice().sort((p,q)=>(ger(q)??-1)-(ger(p)??-1)).slice(0,4);
  const rk=ranking().slice(0,5), rmax=rk.length?rk[0].v:1;
  const ev=S.data.eventos, tot=ev.length;
  const cont=ST_EVENTO.map(s=>[s,ev.filter(x=>(x.status||'Prospecção')===s).length]);
  const mk=S.data.marcas, mkAb=mk.filter(x=>!['Fechado','Perdido'].includes(x.status));
  const prospects=S.data.artistas.filter(a=>DRAFT_COLS.includes(a.status));
  const parte=f.res/3;
  const ultimos=ev.filter(e=>e.data&&e.data<=TODAY&&['Realizado','Pago'].includes(e.status)).sort((a,b)=>b.data.localeCompare(a.data)).slice(0,3);
  paint(`
  <div class="bar"><h2>Visão geral</h2>${monthNav()}</div>
  <p class="sub">Temporada ${YEAR}</p>
  <div class="kpis">
    <div class="kpi"><label>Entrou no mês</label><b class="pos">${money(f.ent)}</b><em>${f.L.filter(x=>x.tipo==='Entrada').length} lançamentos</em></div>
    <div class="kpi"><label>Saiu no mês</label><b class="neg">${money(f.sai)}</b><em>sem retiradas</em></div>
    <div class="kpi"><label>Resultado</label><b class="${f.res<0?'neg':''}">${money(f.res)}</b><em>${money(parte)} por sócio</em></div>
    <div class="kpi"><label>A receber</label><b>${money(rec.reduce((a,x)=>a+(+x.valor||0),0))}</b><em>a pagar ${money(pag.reduce((a,x)=>a+(+x.valor||0),0))}</em></div>
  </div>
  <h3>Destaques do elenco</h3>
  ${top.length?`<div class="cards top4">${top.map(a=>pcard(a)).join('')}</div>`
    :`<div class="rows">${empty('Elenco vazio','Cadastre artistas na aba Artistas ou drafte alguém do quadro de Draft.')}</div>`}
  <div class="two">
    <div>
      ${atras.length?`<h3 class="late">Follow-ups atrasados · ${atras.length}</h3><div class="rows">${atras.slice(0,5).map(x=>dateRow(x,1)).join('')}</div>`:''}
      <h3>Próximos jogos</h3>
      <div class="rows">${prox.length?prox.map(x=>dateRow(x)).join(''):empty('Nada marcado daqui pra frente','Cadastre na Agenda ou dê data a um evento.')}</div>
      <h3>Artilharia ${YEAR}</h3>
      <div class="rows">${rk.length?rk.map((r,i)=>`<button class="row withav" type="button" data-prof="${r.a.id}">
        ${av(r.a.foto,r.a.nome)}
        <div class="t">${i+1}. ${esc(r.a.nome)}</div>
        <div class="s"><span style="display:block;height:5px;background:var(--line);border-radius:2px;margin-top:4px"><i style="display:block;height:100%;width:${Math.max(4,r.v/rmax*100)}%;background:var(--acc);border-radius:2px"></i></span></div>
        <div class="r"><span class="v">${money(r.v)}</span><span style="font-size:12px;color:var(--mut)">${r.n} evento${r.n>1?'s':''}</span></div></button>`).join('')
        :empty('Sem contratos fechados neste ano','Quando um evento estiver Fechado, Realizado ou Pago, o faturamento entra aqui por artista.')}</div>
    </div>
    <div>
      <h3>Divisão entre sócios · ${monthLabel(S.month)}</h3>
      <div class="legend">${[0,1,2].map(i=>`<span style="--c:var(--acc)">${esc(S.socios[i])}</span><b>${money(parte-f.ret[i])}</b>`).join('')}</div>
      <p style="font-size:12px;color:var(--mut);margin:6px 0 0">Saldo de cada um: um terço do resultado menos o que já retirou.</p>
      <h3>Eventos</h3>
      ${tot?`<div class="funnel">${cont.filter(c=>c[1]).map(([s,n])=>`<i style="width:${n/tot*100}%;background:${FUNNEL_C[s]}" title="${esc(s)}: ${n}"></i>`).join('')}</div>
      <div class="legend">${cont.map(([s,n])=>`<span style="--c:${FUNNEL_C[s]}">${esc(s)}</span><b>${n}</b>`).join('')}</div>`
      :`<p class="sub" style="margin:0">Nenhum evento ainda.</p>`}
      <h3>Marcas</h3>
      ${mk.length?`<div class="funnel">${ST_MARCA.map(s=>[s,mk.filter(x=>(x.status||'A prospectar')===s).length]).filter(c=>c[1]).map(([s,n])=>`<i style="width:${n/mk.length*100}%;background:${MARCA_C[s]}"></i>`).join('')}</div>
      <div class="legend">${ST_MARCA.map(s=>`<span style="--c:${MARCA_C[s]}">${esc(s)}</span><b>${mk.filter(x=>(x.status||'A prospectar')===s).length}</b>`).join('')}</div>
      <p style="font-size:13px;color:var(--mut);margin-top:12px">Potencial em aberto: <b style="color:var(--fg)">${money(mkAb.reduce((a,x)=>a+(+x.potencial||0),0))}</b></p>`:`<p class="sub" style="margin:0">Nenhuma marca no funil.</p>`}

    </div>
  </div>
  ${ultimos.length?`<h3>Últimos eventos</h3><div class="evgrid">${ultimos.map(ecard).join('')}</div>`:''}`);
}

/* ---------- Elenco ---------- */
function vElenco(){
  const elenco=S.data.artistas.filter(a=>a.status==='Ativo'||!a.status);
  const nichos=[...new Set(elenco.map(a=>(a.segmento||'').trim()).filter(Boolean))].sort();
  const gs=elenco.map(ger).filter(x=>x!=null);
  const tiers={};elenco.forEach(a=>{const t=tier(ger(a));if(t!=='none')tiers[t]=(tiers[t]||0)+1});
  paint(`<div class="bar"><h2>Artistas</h2><button class="add" type="button" data-act="novo" data-v="artistas" data-def="${esc(JSON.stringify({status:'Ativo'}))}">+ Artista</button></div>
  ${artSeg()}
  <p class="sub">${elenco.length} no elenco${gs.length?` · GER médio ${Math.round(gs.reduce((a,b)=>a+b,0)/gs.length)}`:''}${['elite','ouro','prata','bronze'].filter(t=>tiers[t]).map(t=>` · ${tiers[t]} ${TIER_N[t]}`).join('')}</p>

function spark(h){
  const sm=window.innerWidth<600,W=sm?420:1000,H=sm?120:150,L=12,R=16,T=22,B=24;
  const vs=h.map(p=>p.o),mn=Math.max(0,Math.min(...vs)-6),mx=Math.min(99,Math.max(...vs)+6);
  const x=i=>L+(W-L-R)*(h.length===1?0.5:i/(h.length-1)), y=v=>T+(H-T-B)*(1-(v-mn)/Math.max(1,mx-mn));
  const pts=h.map((p,i)=>[x(i),y(p.o)]);
  const area=`M${pts[0][0]},${H-B} `+pts.map(p=>`L${p[0]},${p[1]}`).join(' ')+` L${pts[pts.length-1][0]},${H-B} Z`;
  const last=h[h.length-1],first=h[0];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do geral de ${first.o} para ${last.o}">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--acc)" opacity=".12"/>
    <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:2.5}" fill="${i===pts.length-1?'var(--acc)':'var(--fg)'}"><title>${esc(dFull(h[i].d))}: ${h[i].o}</title></circle>`).join('')}
    <text x="${pts[pts.length-1][0]}" y="${pts[pts.length-1][1]-10}" text-anchor="end" font-size="14" font-weight="700" fill="var(--fg)">${last.o}</text>
    <text x="${L}" y="${H-6}" font-size="11" fill="var(--mut)">${esc(dFull(first.d))}</text>
    <text x="${W-R}" y="${H-6}" font-size="11" fill="var(--mut)" text-anchor="end">${esc(dFull(last.d))}</text>
  </svg>`;
}

function chart(){
  const ms=[5,4,3,2,1,0].map(k=>shiftMonth(S.month,-k)), d=ms.map(m=>finMonth(m));
  const max=Math.max(1,...d.map(x=>Math.max(x.ent,x.sai)));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const s=[1,2,2.5,5,10].find(s=>s*p>=max);return s*p})();
  const W=600,H=190,L=56,B=26,T=10,ch=H-B-T,cw=(W-L-8)/6,bw=Math.min(22,cw/3.2);
  const y=v=>T+ch-(v/nice)*ch, kfmt=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(v);
  let g='';
  [0,.5,1].forEach(r=>{const v=nice*r;g+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${kfmt(v)}</text>`});
  const pts=[];
  d.forEach((x,i)=>{const cx=L+cw*i+cw/2;
    g+=`<rect x="${cx-bw-1}" y="${y(x.ent)}" width="${bw}" height="${Math.max(0,ch+T-y(x.ent))}" fill="var(--pos)" rx="1"><title>Entradas ${money(x.ent)}</title></rect>`;
    g+=`<rect x="${cx+1}" y="${y(x.sai)}" width="${bw}" height="${Math.max(0,ch+T-y(x.sai))}" fill="var(--neg)" rx="1"><title>Saídas ${money(x.sai)}</title></rect>`;
    const mm=+ms[i].split('-')[1];
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${i===5?'var(--fg)':'var(--mut)'}" font-weight="${i===5?600:400}">${MES[mm-1]}</text>`;
    pts.push([cx,y(Math.max(0,x.res))]);});
  g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--fg)" stroke-width="1.5"/>`;
  g+=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===5?4:2.5}" fill="var(--fg)"><title>Resultado ${money(d[i].res)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas dos últimos 6 meses">${g}</svg>`;
}

async function shrink(file,kind){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const [w,h]=kind==='capa'?[960,540]:kind==='logo'?[240,240]:[480,480];
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    const iw=img.naturalWidth,ih=img.naturalHeight;
    if(kind==='logo'){x.fillStyle='#fff';x.fillRect(0,0,w,h);const s=Math.min(w*.86/iw,h*.86/ih);x.drawImage(img,(w-iw*s)/2,(h-ih*s)/2,iw*s,ih*s)}
    else{const s=Math.max(w/iw,h/ih),dw=iw*s,dh=ih*s;x.drawImage(img,(w-dw)/2,(h-dh)*(kind==='capa'?.5:.22),dw,dh)}
    let q=.82,out=c.toDataURL('image/jpeg',q);
    while(out.length>700000&&q>.4){q-=.12;out=c.toDataURL('image/jpeg',q)}
    return out;
  }finally{URL.revokeObjectURL(url)}
}

    if(S.detail&&S.detail.id===docId){S.detail=null;if(history.state&&history.state.d)history.replaceState(null,'')}

}

/* ---------- Instagram (API oficial da Meta: Business Discovery) ---------- */
let IG=null, igAutoDone=false;
const GV='v21.0';
async function igApi(path,params){
  const u=new URL(`https://graph.facebook.com/${GV}/${path}`);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u);const j=await r.json().catch(()=>({error:{message:'Resposta inválida'}}));
  if(j.error)throw j.error;return j;
}
async function igConnect(token){
  try{const me=await igApi('me',{fields:'instagram_business_account{id,username}',access_token:token});
    if(me.instagram_business_account)return{igId:me.instagram_business_account.id,username:me.instagram_business_account.username}}
  catch(e){if(e.code===190)throw e}
  const acc=await igApi('me/accounts',{fields:'name,instagram_business_account{id,username}',access_token:token});
  const p=(acc.data||[]).find(x=>x.instagram_business_account);
  if(!p)throw{message:'nenhuma conta profissional do Instagram ligada a uma página do Facebook neste token.'};
  return{igId:p.instagram_business_account.id,username:p.instagram_business_account.username};
}
async function igLookup(h){
  if(!IG)throw{message:'Instagram não conectado'};
  const f=`business_discovery.username(${h}){username,name,profile_picture_url,followers_count,media_count,media.limit(12){like_count,comments_count,media_product_type,permalink}}`;
  const j=await igApi(IG.igId,{fields:f,access_token:IG.token});
  const b=j.business_discovery||{};
  const m=(b.media&&b.media.data)||[];
  const inter=m.filter(x=>x.like_count!=null).map(x=>(x.like_count||0)+(x.comments_count||0));
  const eng=inter.length&&b.followers_count?inter.reduce((a,c)=>a+c,0)/inter.length/b.followers_count*100:null;
  const reels=m.filter(x=>x.media_product_type==='REELS'&&x.permalink).sort((a,c)=>((c.like_count||0)+(c.comments_count||0))-((a.like_count||0)+(a.comments_count||0))).slice(0,3).map(x=>x.permalink);
  return{nome:b.name||'',seguidores:b.followers_count||0,engaj:eng!=null?Math.round(eng*10)/10:null,fotoUrl:b.profile_picture_url||'',reels};
}
function igErr(x,h){
  if(x&&x.code===190)return 'A conexão com o Instagram expirou. Gere um token novo em Ajustes.';
  if(x&&(x.code===110||x.code===100||x.error_subcode===2207013))return `Não achei @${h} como conta profissional. O Instagram só libera dados de contas Criador ou Comercial; preencha os números à mão.`;
  if(x&&(x.code===4||x.code===17||x.code===32))return 'Limite de buscas do Instagram atingido. Tente de novo em uma hora.';
  return 'Não foi possível buscar no Instagram agora. Preencha à mão ou tente de novo.';
}
async function urlToData(url){try{const r=await fetch(url,{mode:'cors'});if(!r.ok)return null;return await shrink(await r.blob(),'sq')}catch(e){return null}}
async function igSync(id){
  const a=art(id),h=handle(a&&a.insta);if(!a||!h)return null;
  const d=await igLookup(h);
  const o={seguidores:d.seguidores||a.seguidores||'',igSyncEm:new Date().toISOString()};
  if(d.engaj!=null)o.engaj=d.engaj;
  if(d.fotoUrl&&(!a.foto||a.fotoAuto)){o.foto=await urlToData(d.fotoUrl)||d.fotoUrl;o.fotoAuto=true}
  if(!String(a.destaques||'').trim()&&d.reels.length)o.destaques=d.reels.join('\n');
  await save('artistas',id,o);return d;
}
async function igSyncBtn(id,btn){
  btn.disabled=true;btn.textContent='Buscando…';
  try{const d=await igSync(id);toast(`Atualizado: ${compact.format(d.seguidores||0)} seguidores`)}
  catch(x){toast(igErr(x,handle((art(id)||{}).insta)))}
  render();
}
async function igAuto(){
  if(igAutoDone||!IG||!S.data.artistas.length)return;igAutoDone=true;
  const lim=new Date(Date.now()-7*864e5).toISOString();
  const L=S.data.artistas.filter(a=>a.insta&&(!a.igSyncEm||a.igSyncEm<lim)).slice(0,15);
  for(const a of L){try{await igSync(a.id)}catch(x){if(x&&(x.code===190||x.code===4||x.code===17||x.code===32))break}await new Promise(r=>setTimeout(r,1500))}
}

/* ---------- música (Spotify) ---------- */
const music=$('#music'),muBody=$('#muBody');
function spEmbed(v){
  v=String(v||'').trim();let m=v.match(/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(?:embed\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/)||v.match(/^spotify:(playlist|album|track|artist|show|episode):([A-Za-z0-9]+)$/);
  return m?`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`:'';
}
const LSg=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, LSs=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function muPick(msg){
  muBody.innerHTML=`<form class="mu-pick" id="muForm"><input id="muLink" placeholder="Cole o link de uma playlist, álbum ou música do Spotify" autocomplete="off" aria-label="Link do Spotify"><button class="add" type="submit">Tocar</button>
    <button class="btn2" type="button" data-sp="https://open.spotify.com/playlist/37i9dQZEVXbMXbN3EUUhlg">Top 50 Brasil</button><span class="hint">${esc(msg||'No Spotify: Compartilhar → Copiar link.')}</span></form>`;
  $('#muForm').onsubmit=e=>{e.preventDefault();muPlay($('#muLink').value)};
  muBody.querySelector('[data-sp]').onclick=e=>muPlay(e.target.dataset.sp);
  music.classList.remove('min');
}
function muPlay(link){
  const src=spEmbed(link);if(!src){muPick('Esse link não é do Spotify. Tente de novo.');return}
  LSs('draft_musica',link);
  muBody.innerHTML=`<iframe src="${esc(src)}" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Player do Spotify"></iframe>`;
}
function muOpen(){music.hidden=false;document.body.classList.add('has-music');if(!muBody.innerHTML){const l=LSg('draft_musica');l?muPlay(l):muPick()}LSs('draft_musica_on','1')}
$('#btnMusica').onclick=()=>{if(music.hidden)muOpen();else music.classList.toggle('min')};
$('#muMin').onclick=()=>music.classList.toggle('min');
$('#muTrocar').onclick=()=>muPick();
$('#muClose').onclick=()=>{music.hidden=true;muBody.innerHTML='';document.body.classList.remove('has-music');LSs('draft_musica_on',null)};

const newId=c=>db.collection(c).doc().id;
function applyLocal(op){
  if(!S.data[op.c])return;
  if(op.op==='del')S.data[op.c]=S.data[op.c].filter(x=>x.id!==op.id);
  else{const i=S.data[op.c].findIndex(x=>x.id===op.id);const row={id:op.id,...op.body};if(i<0)S.data[op.c].push(row);else S.data[op.c][i]=row}
}
const wait=p=>Promise.race([p,new Promise(r=>setTimeout(r,navigator.onLine?5000:30))]);
function denied(x){if(x&&x.code==='permission-denied')showStatus('Seu e-mail não tem permissão para salvar. Peça para liberar nas regras do Firebase.')}
async function put(c,id,body){const p=db.collection(c).doc(id).set(body);p.catch(denied);await wait(p)}
async function save(coll,id,o){
  const prev=S.data[coll].find(x=>x.id===id);
  const {id:_,...rest}=prev||{};
  const body={...rest,...o};
  if(prev)body.atualizadoEm=new Date().toISOString();else body.criadoEm=new Date().toISOString();
  if(coll==='artistas'){
    const g=ger(body),h=Array.isArray(body.historico)?body.historico.slice():[];
    if(g!=null){const last=h[h.length-1];if(!last||last.o!==g){if(last&&last.d===TODAY)h[h.length-1]={d:TODAY,o:g};else h.push({d:TODAY,o:g})}}
    body.historico=h.slice(-36);
  }
  applyLocal({op:'set',c:coll,id,body});
  await put(coll,id,body);
}
async function remove(coll,id){
  if(!id)return;applyLocal({op:'del',c:coll,id});
  const p=db.collection(coll).doc(id).delete();p.catch(denied);await wait(p);
}
const status=$('#status');
let pending=false, forced='';
function showStatus(msg){
  if(msg!==undefined)forced=msg;
  let m=forced;
  if(!m&&!navigator.onLine)m='Sem internet. Tudo que você salvar fica no aparelho e sincroniza sozinho quando a conexão voltar.';
  else if(!m&&pending)m='Enviando alterações…';
  status.hidden=!m;status.textContent=m;
}
window.addEventListener('online',()=>showStatus());
window.addEventListener('offline',()=>showStatus());

async function seedOnce(){
  try{
    const flag=await db.doc('config/seed').get({source:'server'});

    const any=await db.collection('marcas').limit(1).get({source:'server'});
    const b=db.batch();
    if(any.empty)SEED.forEach(([id,marca,grupo,segmento,obs])=>b.set(db.collection('marcas').doc(id),{marca,grupo,segmento,status:'A prospectar',obs:'Sugestão: '+obs,criadoEm:new Date().toISOString()}));
    b.set(db.doc('config/seed'),{em:new Date().toISOString()});
    await b.commit();
  }catch(e){}
}
let rT=null;
const softRender=()=>{clearTimeout(rT);rT=setTimeout(()=>{if(sheet.hidden)render()},40)};
function start(){
  unsubs.forEach(u=>u());unsubs=[];
  COLLS.forEach(c=>unsubs.push(db.collection(c).onSnapshot({includeMetadataChanges:true},snap=>{
    S.data[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
    const p=snap.metadata.hasPendingWrites;if(p!==pending){pending=p;showStatus()}
    softRender();
    if(c==='artistas'&&!snap.metadata.fromCache)igAuto();
  },e=>{if(e.code==='permission-denied')showStatus('Seu e-mail ('+(auth.currentUser&&auth.currentUser.email)+') não está liberado neste painel. Peça a um sócio para adicionar nas regras do Firebase.');else showStatus('A conexão com os dados caiu. Recarregue a página.')})));

  seedOnce();
}
auth.onAuthStateChanged(u=>{
